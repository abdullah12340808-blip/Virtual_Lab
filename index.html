<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المخبر الافتراضي</title>
  <style>
    /* أضف هنا النمط السابق الذي قمت بإرساله سابقًا */
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #112040 0%, #08111f 60%);
      color: #eef4ff;
      min-height: 100vh;
      overflow-x: hidden;
      margin: 0;
      padding: 16px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: rgba(16, 28, 51, .86);
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, .25);
      margin-bottom: 16px;
    }
    .brand h1 { margin: 0; font-size: 22px; color: #7dd3fc; }
    .brand p { margin: 4px 0 0; color: #9fb2d1; font-size: 13px; }
    .screen { display: none; }
    .screen.active { display: block; }
    .panel { background: rgba(16, 28, 51, .92); border-radius: 24px; box-shadow: 0 12px 30px rgba(0, 0, 0, .25); padding: 18px; }
    .btn {
      padding: 12px 18px;
      font-size: 16px;
      background-color: #38bdf8;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color .3s ease;
      margin: 10px 0;
    }
    .btn:hover {
      background-color: #22c55e;
    }
    .btn.secondary {
      background-color: #d1d5db;
      color: #333;
    }
    .btn.secondary:hover {
      background-color: #9ca3af;
    }
    .grid {
      display: grid;
      gap: 20px;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    }
    .card {
      background: linear-gradient(180deg, rgba(22,37,68,.95), rgba(12,21,39,.95));
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,.25);
      transition: transform .2s ease;
    }
    .card:hover {
      transform: translateY(-5px);
    }
    .card h3 { margin: 0 0 8px; font-size: 18px; color: #eef4ff; }
    .card p { color: #9fb2d1; line-height: 1.7; font-size: 14px; }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="brand">
      <h1>المخبر الافتراضي</h1>
      <p>واجهة امتحانية تفاعلية مبنية على المواد الدراسية المختلفة للجلسات المخبرية.</p>
    </div>
    <div class="chip" id="breadcrumbChip">الصفحة الرئيسية</div>
  </div><!-- Home -->

  <section id="homeScreen" class="screen active">
    <div class="panel">
      <h2>الاختبارات</h2>
      <p>اختر السنة، الفصل، المادة، ثم الجلسة لإجراء الاختبار.</p>

      <button class="btn" onclick="selectYear(2)">السنة الثانية</button>
      <button class="btn" onclick="selectYear(3)">السنة الثالثة</button>

      <div id="faselSelect" class="hidden">
        <button class="btn" onclick="selectFasel(1)">الفصل الأول</button>
        <button class="btn" onclick="selectFasel(2)">الفصل الثاني</button>
      </div>

      <div id="materiaSelect" class="hidden">
        <button class="btn" onclick="selectMateria('الكيمياء الفيزيائية')">الكيمياء الفيزيائية</button>
        <button class="btn" onclick="selectMateria('الصيدلانيات1')">الصيدلانيات1</button>
      </div>

      <div id="sessionSelect" class="hidden">
        <button class="btn" onclick="startTest()">ابدأ الاختبار</button>
      </div>
    </div>
  </section>

  <section id="testsScreen" class="screen hidden">
    <div class="panel">
      <h2 id="unitTitle">الاختبار الأول</h2>
      <p id="unitDesc">قم بحل هذا الاختبار بناءً على الجلسة المختارة.</p>
      <button class="btn secondary" onclick="goHome()">العودة</button>
    </div>
  </section>

  <section id="labScreen" class="screen hidden">
    <div class="panel">
      <h2 id="labTitle">المخبر الافتراضي</h2>
      <p id="labSubtitle"></p>
      <button class="btn secondary" onclick="backToTests()">العودة للتجارب</button>
      <button class="btn secondary" onclick="restartTest()">إعادة المحاولة</button>
    </div>
  </section>

  <script>
    const data = {
      2: { 1: ['الكيمياء الفيزيائية', 'الصيدلانيات1'], 2: ['الكيمياء العضوية2', 'الصيدلانيات1'] },
      3: { 1: ['الأحياء1', 'فارماكولوجي1'], 2: ['الدمويات', 'فارماكولوجي2'] }
    };

    let selectedYear = null;
    let selectedFasel = null;
    let selectedMateria = null;

    function selectYear(year) {
      selectedYear = year;
      document.getElementById('faselSelect').classList.remove('hidden');
      document.getElementById('homeScreen').classList.add('hidden');
    }

    function selectFasel(fasel) {
      selectedFasel = fasel;
      document.getElementById('materiaSelect').classList.remove('hidden');
      document.getElementById('faselSelect').classList.add('hidden');
    }

    function selectMateria(materia) {
      selectedMateria = materia;
      document.getElementById('sessionSelect').classList.remove('hidden');
      document.getElementById('materiaSelect').classList.add('hidden');
    }

    function startTest() {
      document.getElementById('testsScreen').classList.remove('hidden');
      document.getElementById('homeScreen').classList.add('hidden');
    }

    function goHome() {
      document.getElementById('homeScreen').classList.remove('hidden');
      document.getElementById('testsScreen').classList.add('hidden');
    }

    function backToTests() {
      document.getElementById('testsScreen').classList.remove('hidden');
      document.getElementById('labScreen').classList.add('hidden');
    }

    function restartTest() {
      alert('إعادة المحاولة');
    }
  </script>

</body>
</html>
