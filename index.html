<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المخبر الافتراضي</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>اختبار الكيمياء الصيدلية</h1>
        <p>اختر السنة والفصل والمادة ثم الجلسة لإجراء الاختبار المخبرى التفاعلي.</p>
    </header>

    <div id="yearSelection" class="selection-section">
        <h2>اختر السنة</h2>
        <select id="yearSelect" onchange="loadFasalOptions()">
            <option value="">-- اختر السنة --</option>
            <option value="2">السنة الثانية</option>
            <option value="3">السنة الثالثة</option>
        </select>
    </div>

    <div id="faselSelection" class="selection-section" style="display:none;">
        <h2>اختر الفصل</h2>
        <select id="faselSelect" onchange="loadMaterias()">
            <option value="">-- اختر الفصل --</option>
        </select>
    </div>

    <div id="materiaSelection" class="selection-section" style="display:none;">
        <h2>اختر المادة</h2>
        <select id="materiaSelect" onchange="loadSessions()">
            <option value="">-- اختر المادة --</option>
        </select>
    </div>

    <div id="sessionSelection" class="selection-section" style="display:none;">
        <h2>اختر الجلسة</h2>
        <select id="sessionSelect" onchange="startTest()">
            <option value="">-- اختر الجلسة --</option>
        </select>
    </div>

    <div id="testArea" style="display:none;">
        <h2>الاختبار المخبرى</h2>
        <p id="testDescription"></p>
        <div id="testContent"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
