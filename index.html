<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>مختبر الشوارد المجهولة - جامعة حماة</title>
  <style>
    :root { --bg: #020617; --panel: #0f172a; --accent: #38bdf8; --success: #22c55e; --danger: #ef4444; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: #f8fafc; height: 100vh; overflow: hidden; }

    /* الهيكل العام */
    .screen { display: none; height: 100vh; flex-direction: column; animation: fadeIn 0.4s; }
    .screen.active { display: flex; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .header { background: var(--panel); padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; gap: 15px; z-index: 100; }
    .btn-back { background: #1e293b; border: none; color: white; padding: 8px 15px; border-radius: 8px; cursor: pointer; }

    /* مسرح المختبر الذكي */
    .lab-area { flex: 1; position: relative; background: radial-gradient(circle, #1e293b, #020617); overflow: hidden; display: flex; align-items: center; justify-content: center; }
    
    /* موقد بنزن */
    .burner { position: absolute; left: 30px; bottom: 100px; display: flex; flex-direction: column; align-items: center; }
    .flame { width: 30px; height: 50px; background: linear-gradient(to top, #3b82f6, #f97316, transparent); border-radius: 50% 50% 20% 20%; filter: blur(2px); opacity: 0; transition: 0.3s; }
    .flame.on { opacity: 1; animation: flicker 0.1s infinite; }
    @keyframes flicker { from { transform: scaleY(1); } to { transform: scaleY(1.2); } }

    /* الأنبوب */
    #tube { width: 60px; height: 190px; position: relative; z-index: 50; transition: 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
    .glass { position: absolute; inset: 0; border: 2.5px solid rgba(255,255,255,0.3); border-radius: 0 0 30px 30px; background: rgba(255,255,255,0.05); backdrop-filter: blur(5px); overflow: hidden; }
    .content { position: absolute; bottom: 0; width: 100%; height: 30%; transition: 1.5s; background: rgba(255,255,255,0.1); }
    .precipitate { position: absolute; bottom: 0; width: 100%; height: 0%; transition: 2s; filter: blur(1px); }

    /* القوائم والتحكم */
    .controls-panel { background: var(--panel); padding: 15px; display: flex; flex-direction: column; gap: 10px; border-top: 2px solid var(--accent); }
    .reagents-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn-action { background: #1e293b; border: 1px solid rgba(255,255,255,0.1); color: white; padding: 12px; border-radius: 10px; font-size: 13px; cursor: pointer; }
    .btn-special { background: #0369a1; border: none; font-weight: bold; }
    
    /* شاشة النتيجة */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; text-align: center; }
    .modal.active { display: flex; }
    .modal-box { background: var(--panel); padding: 30px; border-radius: 20px; border: 1px solid var(--accent); width: 100%; max-width: 400px; }

    #status-msg { position: absolute; top: 10px; width: 100%; text-align: center; color: var(--accent); font-weight: bold; text-shadow: 0 0 10px #000; }
  </style>
</head>
<body>

<div id="app">
    <div id="scrMain" class="screen active">
        <div class="header"><span>كلية الصيدلة - مختبر الكيمياء</span></div>
        <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; gap:20px;">
            <div style="font-size:60px;">🔬</div>
            <button class="btn-action" style="width:100%; max-width:320px; background:var(--accent); color:#000; font-weight:bold; font-size:18px;" onclick="initTest()">اختبار الكشف عن الشوارد الموجبة</button>
            <p style="color:#64748b; font-size:12px;">ملاحظة: سيتم إعطاؤك عينة مجهولة وعليك اكتشافها</p>
        </div>
    </div>

    <div id="scrLab" class="screen">
        <div class="header">
            <button class="btn-back" onclick="location.reload()">← انسحاب</button>
            <span style="font-size:14px;">تحليل عينة مجهولة</span>
        </div>
        
        <div class="lab-area">
            <div id="status-msg">العينة جاهزة للاختبار..</div>
            <div class="burner"><div id="flame" class="flame"></div><div style="width:40px; height:8px; background:#475569; border-radius:4px;"></div></div>
            
            <div id="tube">
                <div class="glass">
                    <div id="liquid" class="content"></div>
                    <div id="prec" class="precipitate"></div>
                </div>
            </div>
            
            <div id="smoke" style="position:absolute; display:none; top:40%; font-size:30px;">💨</div>
        </div>

        <div class="controls-panel">
            <div class="reagents-grid">
                <button class="btn-action" onclick="addReagent('HCl')">حمض HCl</button>
                <button class="btn-action" onclick="addReagent('Acetic')">حمض الخل</button>
                <button class="btn-action" onclick="addReagent('Phosphate')">فوسفات الصوديوم</button>
                <button class="btn-action" onclick="addReagent('Ammonia')">هيدروكسيد الأمونيوم</button>
                <button class="btn-action" onclick="addReagent('Nessler')">كاشف نيسلر</button>
                <button class="btn-action" onclick="addReagent('Cobalt')">كوبالتي نتريت</button>
            </div>
            <div style="display:flex; gap:10px;">
                <button class="btn-action btn-special" style="flex:1; background:#b91c1c;" onclick="toggleHeat()">تسخين 🔥</button>
                <button class="btn-action btn-special" style="flex:1; background:#1d4ed8;" onclick="coolDown()">تبريد ❄️</button>
            </div>
            <button class="btn-action" style="background:var(--success); font-weight:bold;" onclick="showDiagnosis()">تقديم التشخيص النهائي 🔍</button>
        </div>
    </div>

    <div id="modalDiag" class="modal">
        <div class="modal-box">
            <h3>ما هي المادة الموجودة في الأنبوب؟</h3>
            <div style="display:grid; gap:10px; margin-top:20px;">
                <button class="btn-action" onclick="checkAnswer('الكالسيوم')">كالسيوم (Ca++)</button>
                <button class="btn-action" onclick="checkAnswer('المغنيزيوم')">مغنيزيوم (Mg++)</button>
                <button class="btn-action" onclick="checkAnswer('البوتاسيوم')">بوتاسيوم (K+)</button>
                <button class="btn-action" onclick="checkAnswer('الأمونيوم')">أمونيوم (NH4+)</button>
            </div>
            <button class="btn-back" style="margin-top:20px;" onclick="closeModal()">إغلاق</button>
        </div>
    </div>
</div>

<script>
    const ions = ['الكالسيوم', 'المغنيزيوم', 'البوتاسيوم', 'الأمونيوم'];
    let secretIon = '';
    let isHot = false;
    let reagentsAdded = [];

    function initTest() {
        secretIon = ions[Math.floor(Math.random() * ions.length)];
        reagentsAdded = [];
        isHot = false;
        resetUI();
        nav('scrLab');
        console.log("Secret Ion: " + secretIon); // للمطور فقط
    }

    function nav(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function addReagent(r) {
        reagentsAdded.push(r);
        let msg = "أضفت " + r;
        const liq = document.getElementById('liquid');
        const prec = document.getElementById('prec');

        // محاكاة التفاعلات بناءً على المحاضرات
        if (secretIon === 'الكالسيوم') {
            if (r === 'HCl') { liq.style.height = "45%"; msg = "تم تحميض العينة"; }
        } 
        else if (secretIon === 'المغنيزيوم') {
            if (reagentsAdded.includes('Phosphate') && reagentsAdded.includes('Ammonia')) {
                prec.style.height = "30%";
                prec.style.background = "white";
                prec.style.opacity = "1";
                msg = "ظهور راسب أبيض بلوري";
            }
        }
        else if (secretIon === 'الأمونيوم') {
            if (r === 'Nessler') {
                liq.style.background = "#92400e"; // لون بني محمر
                msg = "تغير اللون إلى بني محمر (كاشف نيسلر)";
            }
        }
        else if (secretIon === 'البوتاسيوم') {
            if (r === 'Cobalt' && reagentsAdded.includes('Acetic')) {
                prec.style.height = "25%";
                prec.style.background = "#facc15"; // أصفر برتقالي
                prec.style.opacity = "1";
                msg = "ظهور راسب أصفر برتقالي";
            }
        }

        document.getElementById('status-msg').innerText = msg;
    }

    function toggleHeat() {
        isHot = !isHot;
        const flame = document.getElementById('flame');
        const tube = document.getElementById('tube');
        
        if (isHot) {
            flame.classList.add('on');
            tube.style.transform = "translate(-120px, 30px) rotate(-10deg)";
            
            // تأثير الكشف عن الكالسيوم (اختبار اللهب)
            if (secretIon === 'الكالسيوم' && reagentsAdded.includes('HCl')) {
                setTimeout(() => {
                    flame.style.background = "linear-gradient(to top, #ea580c, #fb923c)"; // برتقالي
                    document.getElementById('status-msg').innerText = "اللهب تلون باللون البرتقالي (آجري)!";
                }, 1000);
            }
            
            // تأثير الأمونيوم عند التسخين
            if (secretIon === 'الأمونيوم') {
                setTimeout(() => {
                    document.getElementById('smoke').style.display = "block";
                    document.getElementById('status-msg').innerText = "تصاعد أبخرة غاز النشادر..";
                }, 1500);
            }
        } else {
            flame.classList.remove('on');
            flame.style.background = "";
            tube.style.transform = "translate(0, 0)";
            document.getElementById('smoke').style.display = "none";
        }
    }

    function coolDown() {
        isHot = false;
        toggleHeat();
        document.getElementById('status-msg').innerText = "تم تبريد العينة في حمام ثلجي";
    }

    function showDiagnosis() { document.getElementById('modalDiag').classList.add('active'); }
    function closeModal() { document.getElementById('modalDiag').classList.remove('active'); }

    function checkAnswer(answer) {
        closeModal();
        if (answer === secretIon) {
            alert("🎉 أحسنت! الإجابة صحيحة. لقد نجحت في الكشف عن " + secretIon);
            location.reload();
        } else {
            alert("❌ إجابة خاطئة! النتائج التي ظهرت لا تتوافق مع " + answer + ". حاول مجدداً.");
        }
    }

    function resetUI() {
        document.getElementById('liquid').style.height = "30%";
        document.getElementById('liquid').style.background = "rgba(255,255,255,0.1)";
        document.getElementById('prec').style.height = "0%";
        document.getElementById('prec').style.opacity = "0";
        document.getElementById('status-msg').innerText = "عينة مجهولة جديدة جاهزة..";
    }
</script>
</body>
</html>
