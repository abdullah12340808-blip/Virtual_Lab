<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المخبر الافتراضي</title>
  <style>
    /* أضف هنا النمط السابق الذي قمت بإرساله سابقًا */
    /* أضف أنماطك هنا (CSS) */
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <h1>المخبر الافتراضي</h1>
        <p>واجهة امتحانية تفاعلية مبنية على المواد الدراسية المختلفة للجلسات المخبرية.</p>
      </div>
      <div class="chip" id="breadcrumbChip">الصفحة الرئيسية</div>
    </div><!-- Home -->

    <section id="homeScreen" class="screen active">
      <div class="panel">
        <div class="screen-head">
          <div>
            <h2>الاختبارات</h2>
            <p>اختر السنة، الفصل، المادة، ثم الجلسة لإجراء الاختبار.</p>
          </div>
        </div>

        <!-- زر لاختيار السنة -->
        <div id="yearSelect">
          <button onclick="selectYear(2)">السنة الثانية</button>
          <button onclick="selectYear(3)">السنة الثالثة</button>
        </div>

        <!-- زر لاختيار الفصل -->
        <div id="faselSelect" class="hidden">
          <button onclick="selectFasel(1)">الفصل الأول</button>
          <button onclick="selectFasel(2)">الفصل الثاني</button>
        </div>

        <!-- زر لاختيار المادة -->
        <div id="materiaSelect" class="hidden">
          <button onclick="selectMateria('الكيمياء الفيزيائية')">الكيمياء الفيزيائية</button>
          <button onclick="selectMateria('الصيدلانيات1')">الصيدلانيات1</button>
          <!-- أضف المزيد من المواد هنا -->
        </div>

        <!-- زر لاختيار الجلسة -->
        <div id="sessionSelect" class="hidden">
          <button onclick="startTest()">ابدأ الاختبار</button>
        </div>
      </div>
    </section>

    <!-- اختبارات داخل الجلسة -->
    <section id="testsScreen" class="screen hidden">
      <div class="panel">
        <div class="screen-head">
          <div>
            <h2 id="unitTitle">الاختبار الأول</h2>
            <p id="unitDesc">قم بحل هذا الاختبار بناءً على الجلسة المختارة.</p>
          </div>
        </div>

        <div id="testCards" class="h-scroll"></div>
      </div>
    </section>

    <!-- المخبر -->
    <section id="labScreen" class="screen hidden">
      <div class="panel">
        <div class="title-row">
          <div>
            <h2 id="labTitle">المخبر الافتراضي</h2>
            <p id="labSubtitle"></p>
          </div>
          <div class="actions">
            <button class="btn secondary" onclick="backToTests()">العودة للتجارب</button>
            <button class="btn secondary" onclick="restartTest()">إعادة المحاولة</button>
          </div>
        </div>

        <div class="lab-layout">
          <div class="lab-visual card">
            <div id="visualLabel">الأنبوب فارغ وجاهز للتجربة.</div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script>
    // البيانات المتعلقة بالسنة والفصل والمادة
    const data = {
      2: { 1: ['الكيمياء الفيزيائية', 'الصيدلانيات1'], 2: ['الكيمياء العضوية2', 'الصيدلانيات1'] },
      3: { 1: ['الأحياء1', 'فارماكولوجي1'], 2: ['الدمويات', 'فارماكولوجي2'] }
    };

    let selectedYear = null;
    let selectedFasel = null;
    let selectedMateria = null;

    // تغيير السنة
    function selectYear(year) {
      selectedYear = year;
      document.getElementById('faselSelect').classList.remove('hidden');
      document.getElementById('yearSelect').classList.add('hidden');
    }

    // تغيير الفصل
    function selectFasel(fasel) {
      selectedFasel = fasel;
      document.getElementById('materiaSelect').classList.remove('hidden');
      document.getElementById('faselSelect').classList.add('hidden');
    }

    // تغيير المادة
    function selectMateria(materia) {
      selectedMateria = materia;
      document.getElementById('sessionSelect').classList.remove('hidden');
      document.getElementById('materiaSelect').classList.add('hidden');
    }

    // بدء الاختبار
    function startTest() {
      document.getElementById('testsScreen').classList.remove('hidden');
      document.getElementById('homeScreen').classList.add('hidden');
    }

    // العودة إلى الصفحة الرئيسية
    function backToTests() {
      document.getElementById('homeScreen').classList.remove('hidden');
      document.getElementById('labScreen').classList.add('hidden');
    }

    // إعادة المحاولة
    function restartTest() {
      alert('إعادة المحاولة');
      // أضف هنا منطق إعادة الاختبار
    }
  </script>
</body>
</html>
