<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>المخبر الافتراضي - تحديث الاستقرار</title>
  <style>
    :root {
      --bg: #050a14; --panel: #0f172a; --accent: #38bdf8; --success: #22c55e; --danger: #ef4444; --text: #f8fafc;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    body { 
      margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); 
      height: 100vh; overflow: hidden;
    }

    /* الهيكل العام */
    .app-container { height: 100%; display: flex; flex-direction: column; }
    .screen { display: none; flex: 1; flex-direction: column; overflow: hidden; }
    .screen.active { display: flex; }

    /* البار العلوي الثابت */
    .nav-header {
      padding: 12px 16px; display: flex; align-items: center; gap: 15px;
      background: var(--panel); border-bottom: 1px solid rgba(255,255,255,0.1); z-index: 100;
    }
    .back-btn { 
      background: #1e293b; border: 1px solid rgba(255,255,255,0.1); color: white; 
      padding: 8px 12px; border-radius: 8px; font-size: 13px;
    }

    /* منطقة العرض المخبري */
    .lab-stage {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      position: relative; background: radial-gradient(circle at center, #1e293b 0%, #050a14 100%);
    }
    .tube-holder { position: relative; width: 60px; height: 180px; margin-bottom: 20px; }
    .tube-body {
      position: absolute; inset: 0; border: 2px solid rgba(255,255,255,0.4);
      border-radius: 0 0 30px 30px; background: rgba(255,255,255,0.1);
      backdrop-filter: blur(3px); overflow: hidden; z-index: 5;
    }
    .liquid { position: absolute; bottom: 0; width: 100%; height: 0%; transition: 1s ease; }
    .precipitate { position: absolute; bottom: 0; width: 100%; height: 0%; background: #fff; filter: blur(1px); opacity: 0; transition: 1s; }
    
    .fire-effect {
      position: absolute; bottom: -35px; left: 50%; transform: translateX(-50%);
      width: 35px; height: 45px; background: orange; border-radius: 50% 50% 20% 20%;
      filter: blur(4px); opacity: 0; transition: 0.3s; z-index: 1;
    }
    .fire-active { opacity: 0.8; animation: flicker 0.1s infinite alternate; }
    @keyframes flicker { from { height: 40px; } to { height: 50px; } }

    /* شبكة الخيارات الثابتة (2x2) */
    .controls-grid {
      background: var(--panel); padding: 15px; border-radius: 25px 25px 0 0;
      display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto; gap: 10px;
      box-shadow: 0 -5px 20px rgba(0,0,0,0.4);
    }
    .option-btn {
      background: #1e293b; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
      padding: 15px 10px; color: white; font-size: 13px; text-align: center;
      display: flex; align-items: center; justify-content: center; min-height: 70px;
    }
    .option-btn.correct { background: rgba(34, 197, 94, 0.2); border-color: var(--success); }
    .option-btn.wrong { background: rgba(239, 68, 68, 0.2); border-color: var(--danger); }

    /* المنيو */
    .menu-scroll { flex: 1; overflow-y: auto; padding: 15px; }
    .menu-card { 
      background: var(--panel); padding: 20px; border-radius: 15px; margin-bottom: 12px;
      border: 1px solid rgba(255,255,255,0.05); text-align: center;
    }

    #statusLabel { font-size: 12px; color: var(--accent); margin-bottom: 8px; text-align: center; display: block;}
  </style>
</head>
<body>

<div class="app-container">
  <div class="nav-header">
    <button class="back-btn" id="globalBackBtn" onclick="navigateBack()">← عودة</button>
    <span id="headerTitle" style="font-weight: bold; font-size: 15px;">المخبر الافتراضي</span>
  </div>

  <div id="menuScreen" class="screen active">
    <div class="menu-scroll" id="menuArea"></div>
  </div>

  <div id="labScreen" class="screen">
    <div class="lab-stage">
      <div id="hintBox" style="position:absolute; top:15px; text-align:center; padding:0 20px; font-size:13px; color:var(--accent);"></div>
      <div class="tube-holder">
        <div class="tube-body">
          <div id="liquidFill" class="liquid"></div>
          <div id="precipFill" class="precipitate"></div>
        </div>
        <div id="flameLayer" class="fire-effect"></div>
      </div>
      <div id="visualStatus" style="font-size: 13px; color: #94a3b8;">جاهز للبدء</div>
    </div>

    <div class="controls-grid" id="optionsGrid">
      <div style="grid-column: span 2;" id="statusLabel">الخطوة 1 من 3</div>
      </div>
  </div>
</div>

<script>
  // بيانات المواد والتجارب
  const db = {
    y2: { name: "السنة الثانية", t2: ["العضوية 2", "الحيوية 1", "العقاقير 1", "التحليلية 1", "الصيدلانيات 2"] },
    y3: { name: "السنة الثالثة", t2: ["الدمويات", "كيمياء العقاقير", "الكيمياء صيدلية 1", "الأحياء 2"] }
  };

  const tests = {
    "الكيمياء صيدلية 1": [
      {
        title: "الكشف عن الكالسيوم",
        hint: "المطلوب: تشكيل راسب حماضات الكالسيوم",
        steps: [
          { q: "إضافة 2 مل من العينة (الكالسيوم)", w: ["إضافة حمض خل", "إضافة ماء مقطر", "تسخين الأنبوب"], e: { h: "30%", c: "rgba(200,220,255,0.4)", m: "تم وضع العينة" } },
          { q: "إضافة حماضات النشادر", w: ["إضافة نترات الفضة", "إضافة هيدروكسيد صوديوم", "إضافة كاشف لوغول"], e: { h: "45%", c: "#fff", p: "20%", m: "تشكل راسب أبيض" } },
          { q: "إضافة حمض HCl (تأكيد الذوبان)", w: ["إضافة ماء", "الغليان", "إضافة كحول"], e: { h: "55%", p: "0%", c: "rgba(255,255,255,0.2)", m: "ذاب الراسب" } }
        ]
      },
      {
        title: "الكشف عن المغنيزيوم",
        hint: "المطلوب: تشكيل راسب فوسفات المغنيزيوم والأمونيوم",
        steps: [
          { q: "إضافة 1 مل من شوارد المغنيزيوم", w: ["إضافة حمض كبريت", "إضافة كاشف بندكت", "إضافة فينوفتالين"], e: { h: "25%", c: "rgba(200,200,200,0.3)", m: "تم وضع العينة" } },
          { q: "إضافة فوسفات ثنائية الصوديوم 10%", w: ["إضافة كلوريد الصوديوم", "إضافة يود", "إضافة سكر"], e: { h: "40%", m: "إضافة الفوسفات..." } },
          { q: "إضافة هيدروكسيد الأمونيوم (نشادر)", w: ["إضافة حمض كلور", "التسخين بشدة", "إضافة حمض نمل"], e: { h: "55%", c: "#fff", p: "25%", m: "تشكل راسب أبيض بلوري" } }
        ]
      }
    ]
  };

  let cur = { view: 'years', year: null, sub: null, test: null, step: 0 };

  function renderMenu() {
    const area = document.getElementById('menuArea');
    const title = document.getElementById('headerTitle');
    area.innerHTML = "";

    if (cur.view === 'years') {
      title.innerText = "المخبر الافتراضي";
      Object.keys(db).forEach(y => area.appendChild(menuBtn(db[y].name, () => { cur.year = y; cur.view = 'subs'; renderMenu(); })));
    } else if (cur.view === 'subs') {
      title.innerText = db[cur.year].name;
      db[cur.year].t2.forEach(s => area.appendChild(menuBtn(s, () => { cur.sub = s; cur.view = 'tests'; renderMenu(); })));
    } else if (cur.view === 'tests') {
      title.innerText = cur.sub;
      const list = tests[cur.sub] || [];
      if (list.length === 0) area.innerHTML = "<p style='text-align:center'>سيتم إضافة التجارب قريباً...</p>";
      list.forEach(t => area.appendChild(menuBtn(t.title, () => startTest(t))));
    }
  }

  function menuBtn(txt, fn) {
    const d = document.createElement('div'); d.className = 'menu-card';
    d.innerHTML = `<h3>${txt}</h3>`; d.onclick = fn; return d;
  }

  function startTest(t) {
    cur.test = t; cur.step = 0;
    document.getElementById('menuScreen').classList.remove('active');
    document.getElementById('labScreen').classList.add('active');
    document.getElementById('headerTitle').innerText = t.title;
    document.getElementById('hintBox').innerText = t.hint;
    resetVisuals();
    renderStep();
  }

  function renderStep() {
    const step = cur.test.steps[cur.step];
    document.getElementById('statusLabel').innerText = `الخطوة ${cur.step + 1} من ${cur.test.steps.length}`;
    
    const grid = document.getElementById('optionsGrid');
    // تنظيف الأزرار السابقة فقط (مع الإبقاء على statusLabel)
    Array.from(grid.getElementsByClassName('option-btn')).forEach(el => el.remove());

    let opts = [{ t: step.q, ok: true }, ...step.w.map(x => ({ t: x, ok: false }))].sort(() => Math.random() - 0.5);

    opts.forEach(o => {
      const b = document.createElement('div'); b.className = 'option-btn';
      b.innerText = o.t;
      b.onclick = () => {
        if (o.ok) {
          b.classList.add('correct');
          apply(step.e);
          cur.step++;
          if (cur.step < cur.test.steps.length) setTimeout(renderStep, 1000);
          else document.getElementById('visualStatus').innerText = "اكتملت التجربة بنجاح! 🎉";
        } else {
          b.classList.add('wrong');
          document.getElementById('visualStatus').innerText = "خطأ في الترتيب العلمي!";
          setTimeout(() => { b.classList.remove('wrong'); }, 1000);
        }
      };
      grid.appendChild(b);
    });
  }

  function apply(e) {
    if (e.h) document.getElementById('liquidFill').style.height = e.h;
    if (e.c) document.getElementById('liquidFill').style.background = e.c;
    if (e.p !== undefined) { 
        document.getElementById('precipFill').style.height = e.p;
        document.getElementById('precipFill').style.opacity = e.p === "0%" ? "0" : "1";
    }
    if (e.m) document.getElementById('visualStatus').innerText = e.m;
    
    // التحكم في اللهب: يظهر فقط إذا كان fire موجود في الخطوة
    const f = document.getElementById('flameLayer');
    if (e.fire) f.classList.add('fire-active');
    else f.classList.remove('fire-active');
  }

  function navigateBack() {
    if (cur.view === 'years') return;
    if (document.getElementById('labScreen').classList.contains('active')) {
      document.getElementById('labScreen').classList.remove('active');
      document.getElementById('menuScreen').classList.add('active');
      cur.view = 'tests';
    } else {
      if (cur.view === 'tests') cur.view = 'subs';
      else if (cur.view === 'subs') cur.view = 'years';
    }
    renderMenu();
  }

  function resetVisuals() {
    document.getElementById('liquidFill').style.height = "0%";
    document.getElementById('precipFill').style.height = "0%";
    document.getElementById('flameLayer').classList.remove('fire-active');
    document.getElementById('visualStatus').innerText = "جاهز للبدء";
  }

  renderMenu();
</script>
</body>
</html>
