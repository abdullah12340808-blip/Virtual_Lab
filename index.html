<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المخبر الافتراضي التعليمي - جامعة حماة</title>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --accent: #38bdf8; --success: #22c55e; --danger: #f43f5e; --text: #f8fafc; --gold: #fbbf24; } 
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; } 
        body { margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; } 
        
        .screen { display: none; height: 100vh; flex-direction: column; animation: fadeIn 0.3s ease; } 
        .screen.active { display: flex; } 
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } } 
        
        .header { background: var(--panel); padding: 18px; border-bottom: 2px solid var(--accent); display: flex; align-items: center; gap: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); } 
        .btn-back { background: rgba(255,255,255,0.1); border: 1px solid var(--accent); color: white; padding: 8px 15px; border-radius: 8px; cursor: pointer; } 
        
        .menu-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; padding: 25px; overflow-y: auto; } 
        .btn-main { width: 100%; max-width: 360px; background: linear-gradient(135deg, #1e293b, #334155); border: 1px solid rgba(255,255,255,0.1); padding: 20px; border-radius: 15px; text-align: center; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.2); } 
        .btn-main:active { transform: scale(0.98); background: var(--accent); color: #000; } 

        /* المختبر الكيميائي الأصلي */
        .lab-stage { flex: 1; position: relative; background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); display: flex; align-items: center; justify-content: center; overflow: hidden; } 
        #tube { width: 60px; height: 180px; position: relative; z-index: 100; transition: 1s; } 
        .glass { position: absolute; inset: 0; border: 3px solid rgba(255,255,255,0.4); border-radius: 0 0 30px 30px; background: rgba(255,255,255,0.1); backdrop-filter: blur(8px); overflow: hidden; } 
        .liquid { position: absolute; bottom: 0; width: 100%; height: 30%; transition: 1.5s; background: rgba(255,255,255,0.2); } 
        .precipitate { position: absolute; bottom: 0; width: 100%; height: 0%; transition: 2s; filter: blur(1px); } 
        .flame { width: 30px; height: 50px; background: linear-gradient(to top, #3b82f6, #f97316, transparent); border-radius: 50% 50% 20% 20%; opacity: 0; transition: 0.3s; } 
        .flame.active { opacity: 1; animation: flicker 0.1s infinite; }
        .controls { background: var(--panel); padding: 15px; border-top: 2px solid var(--accent); }

        /* شبكة الكلمات المتقاطعة الجديدة */
        .cw-board { display: grid; grid-template-columns: repeat(10, 32px); gap: 4px; padding: 20px; background: #334155; border-radius: 12px; box-shadow: inset 0 0 10px #000; }
        .cw-cell { width: 32px; height: 32px; background: transparent; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; transition: 0.3s; }
        .cw-cell.active-cell { background: #1e293b; border: 1px solid var(--accent); cursor: pointer; color: transparent; }
        .cw-cell.active-cell:hover { background: #38bdf844; }
        .cw-cell.solved { background: var(--success) !important; color: white !important; border: none; }

        /* نافذة السؤال (وصلة) */
        .wasla-modal { position: fixed; inset: 0; background: var(--bg); z-index: 1000; display: none; flex-direction: column; align-items: center; padding: 20px; }
        .wasla-modal.active { display: flex; }
        .q-img-box { width: 100%; max-width: 300px; height: 200px; background: white; border-radius: 15px; overflow: hidden; margin-bottom: 20px; border: 4px solid var(--accent); }
        .q-img-box img { width: 100%; height: 100%; object-fit: contain; }
        .ans-slots { display: flex; gap: 8px; margin-bottom: 30px; }
        .slot { width: 40px; height: 45px; border-bottom: 3px solid var(--accent); font-size: 24px; font-weight: bold; text-align: center; }
        .keys-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; width: 100%; max-width: 400px; }
        .key-btn { background: var(--panel); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 8px; text-align: center; font-weight: bold; cursor: pointer; }
        .key-btn.hidden { visibility: hidden; }
    </style>
</head>
<body>

    <div id="scrLogin" class="screen active">
        <div class="header">🔬 المخبر الافتراضي</div>
        <div class="menu-container">
            <div style="font-size: 1.2rem; color: var(--accent);">جامعة حماة - كلية الصيدلة</div>
            <div class="btn-main" onclick="nav('scrYears')">دخول الطالب</div>
        </div>
    </div>

    <div id="scrYears" class="screen">
        <div class="header">اختر السنة الدراسية</div>
        <div class="menu-container">
            <div class="btn-main" onclick="showTerms('y2')">السنة الثانية</div>
            <div class="btn-main" onclick="showTerms('y3')">السنة الثالثة</div>
        </div>
    </div>

    <div id="scrTerms" class="screen">
        <div class="header">
            <button class="btn-back" onclick="nav('scrYears')">←</button>
            <div id="termTitle">الفصل الدراسي</div>
        </div>
        <div class="menu-container">
            <div class="btn-main" onclick="showSubs(1)">الفصل الأول</div>
            <div class="btn-main" onclick="showSubs(2)">الفصل الثاني</div>
        </div>
    </div>

    <div id="scrSubs" class="screen">
        <div class="header">
            <button class="btn-back" onclick="nav('scrTerms')">←</button>
            <div>المواد المتاحة</div>
        </div>
        <div class="menu-container" id="subList"></div>
    </div>

    <div id="scrSessions" class="screen">
        <div class="header">
            <button class="btn-back" onclick="nav('scrSubs')">←</button>
            <div id="sessTitle">الجلسات</div>
        </div>
        <div class="menu-container" id="sessList"></div>
    </div>

    <div id="scrCWBoard" class="screen">
        <div class="header">
            <button class="btn-back" onclick="nav('scrSessions')">←</button>
            <div>كلمات متقاطعة: التخطيط الجرثومي</div>
        </div>
        <div class="menu-container">
            <div class="cw-board" id="boardGrid"></div>
            <p style="font-size: 13px; color: var(--gold); margin-top: 15px;">انقر على المربعات الزرقاء لفتح السؤال</p>
        </div>
    </div>

    <div id="modWasla" class="wasla-modal">
        <div class="header" style="width: 100%; background: none; border: none;">
            <button class="btn-back" onclick="closeWasla()">إلغاء</button>
            <div style="flex:1; text-align:center;">ما هو نوع التخطيط؟</div>
        </div>
        <div class="q-img-box"><img id="qImg" src=""></div>
        <div class="ans-slots" id="ansSlots"></div>
        <div class="keys-grid" id="keysGrid"></div>
        <button class="btn-main" style="margin-top:20px; background: var(--danger); padding:10px;" onclick="resetEntry()">مسح الإجابة</button>
    </div>

    <div id="scrLab" class="screen">
        <div class="header">
            <button class="btn-back" onclick="nav('scrSessions')">←</button>
            <div>كشف الشوارد المجهولة</div>
        </div>
        <div class="lab-stage">
            <div id="tube"><div class="glass"></div><div id="liq" class="liquid"></div><div id="prec" class="precipitate"></div></div>
            <div style="position:absolute; bottom:20px; right:20px;"><div id="flame" class="flame"></div>🔥 موقد بنزن</div>
        </div>
        <div class="controls">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:10px;">
                <button class="btn-main" style="padding:10px; font-size:12px;" onclick="addReagent('HCl')">إضافة HCl</button>
                <button class="btn-main" style="padding:10px; font-size:12px;" onclick="addReagent('NH3')">إضافة نشادر</button>
            </div>
            <button id="heatBtn" class="btn-main" style="background:var(--danger); padding:10px;" onclick="toggleHeat()">تسخين / إيقاف</button>
            <button class="btn-main" style="background:var(--success); margin-top:10px;" onclick="diagnose()">تقديم التشخيص النهائي</button>
        </div>
    </div>

    <script>
        // داتا المناهج (استعادة كاملة)
        const curriculum = {
            y2: { t1: ["الكيمياء الفيزيائية", "الحاسوب", "الصيدلانيات 1", "الكيمياء العضوية 1"], 
                  t2: ["الكيمياء العضوية 2", "الكيمياء الحيوية 1", "العقاقير 1", "التحليلية 1"] },
            y3: { t1: ["التحليلية 2", "الأحياء 1", "العقاقير 2", "فارماكولوجي 1"], 
                  t2: ["الأحياء 2", "الكيمياء صيدلية 1", "الدمويات", "التحليل الآلي"] }
        };

        // داتا الكلمات المتقاطعة (صور حقيقية + حروف مبعثرة)
        const cwData = {
            questions: [
                { id: 1, word: "استمراري", img: "https://i.ibb.co/LzNf9Xp/image.png", cells: [[1,2],[1,3],[1,4],[1,5],[1,6],[1,7],[1,8],[1,9]] },
                { id: 2, word: "اشعاعي", img: "https://i.ibb.co/vYm0f4g/image.png", cells: [[1,2],[2,2],[3,2],[4,2],[5,2],[6,2]] },
                { id: 3, word: "حرفT", img: "https://i.ibb.co/Zz6m7qf/image.png", cells: [[4,2],[4,3],[4,4],[4,5]] },
                { id: 4, word: "اربعحجرات", wordDisplay: "أربع حجرات", img: "https://i.ibb.co/SrtpY2k/image.png", cells: [[8,1],[8,2],[8,3],[8,4],[8,5],[8,6],[8,7],[8,8],[8,9]] }
            ],
            solved: []
        };

        let currentY = '', currentT = 1, secretIon = '', isHeating = false, userEntry = [], currentQ = null;

        function nav(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function showTerms(y) {
            currentY = y;
            document.getElementById('termTitle').innerText = (y === 'y2' ? "السنة الثانية" : "السنة الثالثة");
            nav('scrTerms');
        }

        function showSubs(t) {
            currentT = t;
            const list = document.getElementById('subList');
            list.innerHTML = "";
            curriculum[currentY]['t'+t].forEach(sub => {
                const b = document.createElement('div'); b.className = 'btn-main'; b.innerText = sub;
                b.onclick = () => showSessions(sub); list.appendChild(b);
            });
            nav('scrSubs');
        }

        function showSessions(sub) {
            document.getElementById('sessTitle').innerText = sub;
            const list = document.getElementById('sessList');
            list.innerHTML = "";
            let sess = (sub === "الأحياء 2") ? [{n: "اختبار الكلمات المتقاطعة", type: 'cw'}] : 
                       (sub === "الكيمياء صيدلية 1") ? [{n: "كشف الشوارد المجهولة", type: 'lab'}] : [{n: "الجلسة 1 (نظري)", type: 'none'}];

            sess.forEach(s => {
                const b = document.createElement('div'); b.className = 'btn-main'; b.innerText = s.n;
                b.onclick = () => { if(s.type==='cw') initBoard(); else if(s.type==='lab') startLab(); else alert("قيد التطوير"); };
                list.appendChild(b);
            });
            nav('scrSessions');
        }

        // --- نظام المختبر (استعادة) ---
        function startLab() {
            secretIon = ['كالسيوم', 'مغنيزيوم', 'بوتاسيوم'][Math.floor(Math.random()*3)];
            document.getElementById('liq').style.background = "rgba(255,255,255,0.2)";
            document.getElementById('prec').style.height = "0";
            nav('scrLab');
        }

        function addReagent(r) {
            const liq = document.getElementById('liq');
            liq.style.height = "50%";
            if(secretIon==='مغنيزيوم' && r==='NH3') {
                document.getElementById('prec').style.height = "20%";
                document.getElementById('prec').style.background = "white";
            }
        }

        function toggleHeat() {
            isHeating = !isHeating;
            document.getElementById('flame').classList.toggle('active', isHeating);
            if(isHeating && secretIon==='كالسيوم') {
                setTimeout(() => document.getElementById('liq').style.background = "#fca5a5", 1000);
            }
        }

        function diagnose() {
            const ans = prompt("ما هو تشخيصك للشاردة المجهولة؟");
            if(ans === secretIon) alert("🎉 إجابة صحيحة!"); else alert("❌ خطأ، الشاردة كانت: " + secretIon);
            startLab();
        }

        // --- نظام الكلمات المتقاطعة (زيتونة) ---
        function initBoard() {
            const board = document.getElementById('boardGrid'); board.innerHTML = "";
            for(let r=0; r<10; r++) {
                for(let c=0; c<10; c++) {
                    const cell = document.createElement('div'); cell.className = 'cw-cell';
                    const q = cwData.questions.find(q => q.cells.some(pos => pos[0]===r && pos[1]===c));
                    if(q) {
                        cell.classList.add('active-cell');
                        cell.onclick = () => openWasla(q);
                        if(cwData.solved.includes(q.id)) {
                            cell.classList.add('solved');
                            const idx = q.cells.findIndex(pos => pos[0]===r && pos[1]===c);
                            cell.innerText = q.word[idx];
                        }
                    }
                    board.appendChild(cell);
                }
            }
            nav('scrCWBoard');
        }

        function openWasla(q) {
            currentQ = q; userEntry = [];
            document.getElementById('qImg').src = q.img;
            renderWaslaUI();
            document.getElementById('modWasla').classList.add('active');
        }

        function renderWaslaUI() {
            const slots = document.getElementById('ansSlots'); slots.innerHTML = "";
            for(let i=0; i<currentQ.word.length; i++) {
                const s = document.createElement('div'); s.className = 'slot';
                s.innerText = userEntry[i] || ""; slots.appendChild(s);
            }

            const keys = document.getElementById('keysGrid'); keys.innerHTML = "";
            // خلط الحروف + حروف إضافية
            let letters = (currentQ.word + "نمتلوبج").split('').sort(() => Math.random() - 0.5);
            letters.forEach(l => {
                const b = document.createElement('div'); b.className = 'key-btn'; b.innerText = l;
                b.onclick = () => { if(userEntry.length < currentQ.word.length) { userEntry.push(l); renderWaslaUI(); checkWasla(); } };
                keys.appendChild(b);
            });
        }

        function checkWasla() {
            if(userEntry.length === currentQ.word.length) {
                if(userEntry.join('') === currentQ.word) {
                    alert("بطل! إجابة صحيحة 🎉");
                    cwData.solved.push(currentQ.id);
                    closeWasla(); initBoard();
                } else {
                    alert("حاول مرة أخرى!"); resetEntry();
                }
            }
        }

        function resetEntry() { userEntry = []; renderWaslaUI(); }
        function closeWasla() { document.getElementById('modWasla').classList.remove('active'); }
    </script>
</body>
</html>
