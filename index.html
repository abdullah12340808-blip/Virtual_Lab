<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المخبر الافتراضي - الكيمياء الصيدلية</title>
    <style>
        :root { --liquid-color: #f0f0f0; --precipitate-height: 0%; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f3; text-align: center; }
        .lab-container { display: flex; flex-direction: column; align-items: center; padding: 20px; }
        
        /* تصميم أنبوب الاختبار */
        .test-tube {
            width: 60px; height: 200px; border: 3px solid #ccc;
            border-bottom-left-radius: 30px; border-bottom-right-radius: 30px;
            position: relative; background: rgba(255, 255, 255, 0.3);
            overflow: hidden; box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }
        .liquid {
            position: absolute; bottom: 0; width: 100%; height: 60%;
            background-color: var(--liquid-color); transition: all 0.8s ease;
        }
        .precipitate {
            position: absolute; bottom: 0; width: 100%;
            height: var(--precipitate-height);
            background: rgba(255, 255, 255, 0.8); /* راسب أبيض افتراضي */
            filter: blur(2px); transition: all 1s ease;
        }

        .controls { margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { padding: 10px 15px; cursor: pointer; border: none; border-radius: 5px; background: #2c3e50; color: white; }
        button:hover { background: #34495e; }
        .status-box { margin-top: 20px; font-weight: bold; color: #d35400; }
    </style>
</head>
<body>

<div class="lab-container">
    <h2>مخبر الكيمياء الصيدلية - الجلسة الأولى</h2>
    <p>الشاردة المجهولة: <strong>شوارد الكالسيوم $Ca^{++}$</strong></p>

    <div class="test-tube">
        <div class="liquid" id="liquid"></div>
        <div class="precipitate" id="precipitate"></div>
    </div>

    <div class="status-box" id="status">أضف كاشفاً لبدء التجربة...</div>

    <div class="controls">
        <button onclick="testCalcium('oxalate')">إضافة حماضات النشادر</button>
        <button onclick="testCalcium('sulfate')">إضافة كبريتات الصوديوم</button>
        <button onclick="testFlame()">اختبار اللهب</button>
        <button onclick="resetLab()" style="background: #c0392b;">تفريغ الأنبوب</button>
    </div>
</div>

<script>
    function testCalcium(reagent) {
        const liquid = document.getElementById('liquid');
        const precipitate = document.getElementById('precipitate');
        const status = document.getElementById('status');

        if (reagent === 'oxalate') {
            [span_1](start_span)// تفاعل حماضات النشادر[span_1](end_span)
            document.documentElement.style.setProperty('--precipitate-height', '40%');
            precipitate.style.background = "rgba(255, 255, 255, 0.9)";
            status.innerText = "تشكل راسب أبيض من حماضات الكالسيوم (لا ينحل بحمض الخل)";
        } 
        else if (reagent === 'sulfate') {
            [span_2](start_span)// تفاعل كبريتات الصوديوم[span_2](end_span)
            document.documentElement.style.setProperty('--precipitate-height', '25%');
            precipitate.style.background = "rgba(240, 240, 240, 0.9)";
            status.innerText = "تشكل راسب أبيض من كبريتات الكالسيوم";
        }
    }

    function testFlame() {
        const liquid = document.getElementById('liquid');
        const status = document.getElementById('status');
        [span_3](start_span)// تلوين اللهب بالبرتقالي[span_3](end_span)
        liquid.style.backgroundColor = "#e67e22"; 
        status.innerText = "تلوين اللهب باللون البرتقالي المميز للكالسيوم";
    }

    function resetLab() {
        document.documentElement.style.setProperty('--precipitate-height', '0%');
        document.getElementById('liquid').style.backgroundColor = "#f0f0f0";
        document.getElementById('status').innerText = "تم تنظيف الأنبوب. ابدأ مجدداً.";
    }
</script>

</body>
</html>
