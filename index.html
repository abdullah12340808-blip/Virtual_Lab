<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>المخبر الافتراضي - جامعة حماه</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; margin: 0; padding: 15px; display: flex; justify-content: center; touch-action: manipulation; }
        .app-container { background: white; width: 100%; max-width: 400px; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        .hidden { display: none; }
        
        /* تصميم المخبر */
        .stage { height: 200px; background: #eef2f3; border-radius: 15px; position: relative; display: flex; justify-content: center; align-items: flex-end; margin-bottom: 20px; border: 2px inset #fff; }
        .test-tube { width: 50px; height: 160px; border: 3px solid #7f8c8d; border-bottom-left-radius: 25px; border-bottom-right-radius: 25px; position: relative; background: rgba(255,255,255,0.5); z-index: 5; }
        .liquid { position: absolute; bottom: 0; width: 100%; height: 40%; background: rgba(52, 152, 219, 0.2); transition: 0.5s; }
        .precipitate { position: absolute; bottom: 0; width: 100%; height: 0%; transition: 0.8s; filter: blur(1px); border-radius: 0 0 22px 22px; }
        .flame { position: absolute; bottom: -10px; width: 40px; height: 70px; border-radius: 50% 50% 20% 20%; display: none; filter: blur(6px); z-index: 1; animation: flicker 0.2s infinite; }
        @keyframes flicker { 0% { opacity: 0.8; } 100% { opacity: 1; } }

        /* الأزرار والنصوص */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        button { padding: 15px; border: none; border-radius: 12px; background: #2c3e50; color: white; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; }
        button:active { transform: scale(0.95); background: #34495e; }
        .info-box { background: #fff3e0; border-right: 5px solid #ff9800; padding: 12px; margin: 15px 0; font-size: 14px; min-height: 45px; display: flex; align-items: center; justify-content: center; font-weight: 500; }
        .quiz-area { background: #e8f4fd; padding: 15px; border-radius: 12px; margin-top: 10px; border: 1px solid #b3d7ff; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="home-screen">
        <h2 style="color: #2c3e50;">المخبر الافتراضي الذكي</h2>
        <p style="color: #7f8c8d;">اختبار الكيمياء الصيدلية 1 - الجلسة الأولى</p>
        <button id="btn-start" style="width:100%; background:#27ae60; height: 60px; font-size: 18px;">ابدأ التحليل (عينة مجهولة)</button>
    </div>

    <div id="lab-screen" class="hidden">
        <div class="stage">
            <div id="v-fire" class="flame"></div>
            <div class="test-tube">
                <div class="liquid"></div>
                <div id="v-prec" class="precipitate"></div>
            </div>
        </div>

        <div id="v-msg" class="info-box">لديك عينة مجهولة.. أضف الكواشف للتعرف عليها.</div>

        <div class="grid">
            <button class="lab-action" data-type="oxalate">حماضات النشادر</button>
            <button class="lab-action" data-type="phosphate">فوسفات الصوديوم</button>
            <button class="lab-action" data-type="hcl">إضافة HCl</button>
            <button class="lab-action" data-type="acetic">حمض الخل</button>
            <button class="lab-action" data-type="flame" style="grid-column: span 2; background:#e67e22;">اختبار اللهب</button>
        </div>

        <div id="quiz-zone" class="quiz-area hidden">
            <p id="q-text" style="font-weight:bold; margin-top:0;"></p>
            <div id="q-options" class="grid"></div>
        </div>

        <button id="btn-reset" style="width:100%; margin-top:20px; background:#e74c3c; padding:10px;">إعادة المحاولة</button>
    </div>
</div>

<script>
    let mysteryIon = ""; 

    // محرك الأحداث - الطريقة المضمونة للعمل على كل الأجهزة
    document.addEventListener('click', function(e) {
        // زر البدء
        if (e.target.id === 'btn-start') {
            mysteryIon = Math.random() > 0.5 ? "Ca" : "Mg";
            document.getElementById('home-screen').classList.add('hidden');
            document.getElementById('lab-screen').classList.remove('hidden');
        }

        // أزرار الكواشف
        if (e.target.classList.contains('lab-action')) {
            const type = e.target.getAttribute('data-type');
            handleAction(type);
        }

        // زر الإعادة
        if (e.target.id === 'btn-reset') {
            location.reload();
        }
    });

    function handleAction(type) {
        const prec = document.getElementById('v-prec');
        const msg = document.getElementById('v-msg');
        const fire = document.getElementById('v-fire');
        const quiz = document.getElementById('quiz-zone');
        
        fire.style.display = "none";

        if (mysteryIon === "Ca") {
            if (type === 'oxalate') {
                prec.style.height = "45%"; prec.style.background = "white";
                msg.innerText = "راسب أبيض. هل ينحل بحمض الخل أم HCl؟";
            } else if (type === 'hcl') {
                prec.style.height = "0%";
                msg.innerText = "انحل الراسب تماماً في HCl. العينة هي الكالسيوم!";
                showQuiz("ما هو الفيتامين المساعد على امتصاص الكالسيوم؟", ["فيتامين C", "فيتامين D", "فيتامين B12"], 1);
            } else if (type === 'flame') {
                fire.style.display = "block"; fire.style.background = "radial-gradient(circle, #ff9f43, #ee5253)";
                msg.innerText = "لهب برتقالي! نتيجة مؤكدة للكالسيوم.";
            } else if (type === 'acetic') {
                msg.innerText = "الراسب لم ينحل بحمض الخل (صفة مميزة للكالسيوم).";
            } else {
                msg.innerText = "لم يحدث تفاعل ملحوظ مع هذا الكاشف.";
            }
        } else {
            // منطق المغنيزيوم
            if (type === 'phosphate') {
                prec.style.height = "50%"; prec.style.background = "rgba(255,255,255,0.9)";
                msg.innerText = "راسب أبيض بلوري. اختبر الانحلال في حمض الخل.";
            } else if (type === 'acetic') {
                prec.style.height = "0%";
                msg.innerText = "انحل الراسب في حمض الخل! العينة هي المغنيزيوم.";
                showQuiz("أين يختزن معظم المغنيزيوم في الجسم؟", ["الكبد", "العظام والأسنان", "العضلات فقط"], 1);
            } else if (type === 'flame') {
                msg.innerText = "لا يوجد تلون مميز للهب للمغنيزيوم.";
            } else {
                msg.innerText = "لم يحدث تفاعل ملحوظ.";
            }
        }
    }

    function showQuiz(q, opts, correct) {
        const zone = document.getElementById('quiz-zone');
        zone.classList.remove('hidden');
        document.getElementById('q-text').innerText = q;
        const grid = document.getElementById('q-options');
        grid.innerHTML = "";
        opts.forEach((opt, idx) => {
            const b = document.createElement('button');
            b.innerText = opt;
            b.style.background = "#3498db";
            b.onclick = () => {
                if(idx === correct) alert("أحسنت! إجابة علمية دقيقة.");
                else alert("خطأ! راجع قسم الفوائد في المحاضرة.");
                zone.classList.add('hidden');
            };
            grid.appendChild(b);
        });
    }
</script>
</body>
</html>
