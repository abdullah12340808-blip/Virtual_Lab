<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>المخبر الافتراضي - جامعة حماة</title>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --accent: #38bdf8; --success: #22c55e; --danger: #f43f5e; --text: #f8fafc; --gold: #fbbf24; } 
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; } 
        body { margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; touch-action: none; } 
        
        .screen { display: none; height: 100vh; flex-direction: column; animation: fadeIn 0.2s ease; } 
        .screen.active { display: flex; } 
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } } 
        .header { background: var(--panel); padding: 15px; border-bottom: 2px solid var(--accent); display: flex; align-items: center; gap: 15px; } 
        .btn-back { background: rgba(255,255,255,0.1); border: 1px solid var(--accent); color: white; padding: 6px 12px; border-radius: 8px; border:none; cursor:pointer; } 
        .menu-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; padding: 20px; overflow-y: auto; touch-action: pan-y; } 
        .btn-main { width: 100%; max-width: 340px; background: linear-gradient(135deg, #1e293b, #334155); border: 1px solid rgba(255,255,255,0.1); padding: 18px; border-radius: 12px; text-align: center; font-weight: bold; cursor: pointer; color: white; border:none; } 

        /* شبكة الكلمات المتقاطعة */
        .cw-board { display: grid; grid-template-columns: repeat(10, 32px); gap: 4px; padding: 15px; background: #334155; border-radius: 10px; box-shadow: inset 0 0 15px #000; position: relative; }
        .cw-cell { width: 32px; height: 32px; background: rgba(15, 23, 42, 0.7); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; color: transparent; pointer-events: auto; }
        .cw-cell.active-cell { background: #1e293b; border: 1px solid var(--accent); }
        .cw-cell.solved { background: var(--success) !important; color: white !important; border: none; }

        /* نافذة وصلة */
        .wasla-modal { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: none; flex-direction: column; align-items: center; padding: 20px; touch-action: auto; }
        .wasla-modal.active { display: flex; }
        .q-img-box { width: 100%; max-width: 280px; height: 180px; background: white; border-radius: 12px; overflow: hidden; margin-bottom: 20px; border: 3px solid var(--accent); }
        .q-img-box img { width: 100%; height: 100%; object-fit: contain; }
        .ans-slots { display: flex; gap: 8px; margin-bottom: 30px; flex-wrap: wrap; justify-content: center; }
        .slot { width: 38px; height: 45px; border-bottom: 3px solid var(--accent); font-size: 24px; font-weight: bold; text-align: center; color: white; display:flex; align-items:center; justify-content:center; }
        .slot.fixed { color: var(--success); border-bottom-color: var(--success); }
        
        /* لوحة الحروف الثابتة */
        .keys-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; width: 100%; max-width: 380px; }
        .key-btn { background: var(--panel); border: 1px solid rgba(255,255,255,0.1); padding: 12px 5px; border-radius: 8px; text-align: center; font-weight: bold; font-size: 18px; color: white; cursor:pointer; }
        .key-btn.used { visibility: hidden; pointer-events: none; }

        /* كود المختبر (الأصلي) */
        .lab-stage { flex: 1; position: relative; background: radial-gradient(circle, #1e293b, #0f172a); display: flex; align-items: center; justify-content: center; }
        #tube { width: 55px; height: 170px; position: relative; transition: 1s; }
        .glass { position: absolute; inset: 0; border: 3px solid rgba(255,255,255,0.3); border-radius: 0 0 25px 25px; background: rgba(255,255,255,0.1); }
        .liquid { position: absolute; bottom: 0; width: 100%; height: 30%; transition: 1s; background: rgba(255,255,255,0.2); border-radius: 0 0 22px 22px; }
        #prec { position: absolute; bottom: 0; width: 100%; height: 0%; transition: 2s; border-radius: 0 0 22px 22px; }
        .flame { width: 25px; height: 40px; background: linear-gradient(to top, #3b82f6, #f97316, transparent); border-radius: 50% 50% 20% 20%; opacity: 0; transition: 0.3s; position: absolute; bottom: 20px; }
        .flame.active { opacity: 1; animation: flicker 0.1s infinite; }
        @keyframes flicker { from { transform: scaleY(1); } to { transform: scaleY(1.2); } }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="scrLogin" class="screen active">
        <div class="header">🔬 المخبر الافتراضي</div>
        <div class="menu-container">
            <div style="font-size: 1.1rem; color: var(--accent);">جامعة حماة - كلية الصيدلة</div>
            <div class="btn-main" onclick="nav('scrYears')">دخول الطالب</div>
        </div>
    </div>

    <div id="scrYears" class="screen">
        <div class="header"><button class="btn-back" onclick="nav('scrLogin')">←</button> اختر السنة</div>
        <div class="menu-container">
            <div class="btn-main" onclick="showTerms('y2')">السنة الثانية</div>
            <div class="btn-main" onclick="showTerms('y3')">السنة الثالثة</div>
        </div>
    </div>

    <div id="scrTerms" class="screen">
        <div class="header"><button class="btn-back" onclick="nav('scrYears')">←</button> <span id="termTitle"></span></div>
        <div class="menu-container">
            <div class="btn-main" onclick="showSubs(1)">الفصل الأول</div>
            <div class="btn-main" onclick="showSubs(2)">الفصل الثاني</div>
        </div>
    </div>

    <div id="scrSubs" class="screen">
        <div class="header"><button class="btn-back" onclick="nav('scrTerms')">←</button> المواد المتاحة</div>
        <div class="menu-container" id="subList"></div>
    </div>

    <div id="scrSessions" class="screen">
        <div class="header"><button class="btn-back" onclick="nav('scrSubs')">←</button> الجلسات</div>
        <div class="menu-container" id="sessList"></div>
    </div>

    <div id="scrCWBoard" class="screen">
        <div class="header"><button class="btn-back" onclick="nav('scrSessions')">←</button> شبكة التخطيط</div>
        <div class="menu-container">
            <p style="color: var(--gold); font-size: 13px; margin-bottom: 10px;">مرر إصبعك لفتح الأسئلة</p>
            <div class="cw-board" id="boardGrid" ontouchmove="handleTouchMove(event)"></div>
        </div>
    </div>

    <div id="modWasla" class="wasla-modal">
        <div class="header" style="width: 100%; background: none; border: none;">
            <button class="btn-back" onclick="closeWasla()">إلغاء</button>
            <div style="flex:1; text-align:center; font-weight:bold;">ما نوع التخطيط؟</div>
        </div>
        <div class="q-img-box"><img id="qImg" src=""></div>
        <div class="ans-slots" id="ansSlots"></div>
        <div class="keys-grid" id="keysGrid"></div>
        <button class="btn-main" style="margin-top:20px; background: var(--danger); padding:10px;" onclick="resetEntry()">إعادة المحاولة</button>
    </div>

    <div id="scrLab" class="screen">
        <div class="header"><button class="btn-back" onclick="nav('scrSessions')">←</button> كشف الشوارد</div>
        <div class="lab-stage">
            <div id="tube"><div class="glass"></div><div id="liq" class="liquid"></div><div id="prec"></div></div>
            <div id="flame" class="flame" style="left: 48%;"></div>
        </div>
        <div style="background:var(--panel); padding:20px; border-radius: 20px 20px 0 0;">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:10px;">
                <button class="btn-main" style="padding:10px;" onclick="addReagent('HCl')">إضافة HCl</button>
                <button class="btn-main" style="padding:10px;" onclick="addReagent('NH3')">إضافة نشادر</button>
            </div>
            <button class="btn-main" style="background:var(--danger); width:100%;" onclick="toggleHeat()">تسخين 🔥</button>
            <button class="btn-main" style="background:var(--success); width:100%; margin-top:10px;" onclick="diagnose()">التشخيص النهائي</button>
        </div>
    </div>

    <script>
        const curriculum = {
            y2: { t1: ["الكيمياء الفيزيائية", "الحاسوب", "الصيدلانيات 1", "العضوية 1"], 
                  t2: ["العضوية 2", "الحيوية 1", "العقاقير 1", "التحليلية 1"] },
            y3: { t1: ["التحليلية 2", "الأحياء 1", "العقاقير 2", "فارماكولوجي 1"], 
                  t2: ["الأحياء 2", "الكيمياء صيدلية 1", "الدمويات", "التحليل الآلي"] }
        };

        // صور حقيقية من ويكيميديا للتخطيط الجرثومي
        const cwData = {
            questions: [
                { id: 1, word: "استمراري", img: "https://upload.wikimedia.org/wikipedia/commons/d/d1/Staphylococcus_aureus_on_Agar.jpg", cells: [[1,1],[1,2],[1,3],[1,4],[1,5],[1,6],[1,7],[1,8]] },
                { id: 2, word: "اشعاعي", img: "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d3/Agar_plate_with_colonies.jpg/640px-Agar_plate_with_colonies.jpg", cells: [[1,1],[2,1],[3,1],[4,1],[5,1],[6,1]] },
                { id: 3, word: "حرفT", img: "https://upload.wikimedia.org/wikipedia/commons/7/71/Streak_plates.jpg", cells: [[6,1],[6,2],[6,3],[6,4],[6,5]] },
                { id: 4, word: "اربعحجرات", img: "https://microbiologyinfo.com/wp-content/uploads/2016/01/Quadrant-Streak-Method.jpg", cells: [[1,8],[2,8],[3,8],[4,8],[5,8],[6,8],[7,8],[8,8],[9,8]] }
            ]
        };

        let globalGrid = Array(10).fill().map(() => Array(10).fill(null));
        let currentYear = '', currentTerm = 1, currentQ = null, userEntry = [], secretIon = '', isHeating = false;
        let isModalOpen = false;

        function nav(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function showTerms(y) {
            currentYear = y;
            document.getElementById('termTitle').innerText = (y === 'y2' ? "السنة الثانية" : "السنة الثالثة");
            nav('scrTerms');
        }

        function showSubs(t) {
            currentTerm = t;
            const list = document.getElementById('subList'); list.innerHTML = "";
            curriculum[currentYear]['t'+t].forEach(sub => {
                const b = document.createElement('button'); b.className = 'btn-main'; b.innerText = sub;
                b.onclick = () => showSessions(sub); list.appendChild(b);
            });
            nav('scrSubs');
        }

        function showSessions(sub) {
            const list = document.getElementById('sessList'); list.innerHTML = "";
            let sess = (sub === "الأحياء 2") ? [{n: "اختبار الكلمات المتقاطعة", type: 'cw'}] : 
                       (sub === "الكيمياء صيدلية 1") ? [{n: "كشف الشوارد المجهولة", type: 'lab'}] : [{n: "الجلسة الأولى", type: 'none'}];
            sess.forEach(s => {
                const b = document.createElement('button'); b.className = 'btn-main'; b.innerText = s.n;
                b.onclick = () => { if(s.type==='cw') initBoard(); else if(s.type==='lab') startLab(); else alert("قيد التجهيز"); };
                list.appendChild(b);
            });
            nav('scrSessions');
        }

        // --- نظام التمرير Swipe الحقيقي ---
        function handleTouchMove(e) {
            if (isModalOpen) return;
            const touch = e.touches[0];
            const elem = document.elementFromPoint(touch.clientX, touch.clientY);
            if (elem && elem.classList.contains('active-cell')) {
                const r = elem.dataset.r, c = elem.dataset.c;
                const q = cwData.questions.find(q => q.cells.some(p => p[0] == r && p[1] == c));
                if (q) openWasla(q);
            }
        }

        function initBoard() {
            const board = document.getElementById('boardGrid'); board.innerHTML = "";
            for(let r=0; r<10; r++) {
                for(let c=0; c<10; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cw-cell'; cell.dataset.r = r; cell.dataset.c = c;
                    const q = cwData.questions.find(q => q.cells.some(p => p[0]===r && p[1]===c));
                    if(q) {
                        cell.classList.add('active-cell');
                        if (globalGrid[r][c]) {
                            cell.innerText = globalGrid[r][c];
                            cell.classList.add('solved');
                        }
                    }
                    board.appendChild(cell);
                }
            }
            nav('scrCWBoard');
        }

        function openWasla(q) {
            isModalOpen = true;
            currentQ = q; userEntry = [];
            document.getElementById('qImg').src = q.img;
            
            // تعبئة الحروف المتقاطعة المحلولة مسبقاً
            q.cells.forEach((pos, i) => {
                userEntry[i] = globalGrid[pos[0]][pos[1]] || "";
            });
            
            renderWaslaUI();
            document.getElementById('modWasla').classList.add('active');
        }

        function renderWaslaUI() {
            const slots = document.getElementById('ansSlots'); slots.innerHTML = "";
            currentQ.cells.forEach((pos, i) => {
                const s = document.createElement('div');
                s.className = 'slot' + (globalGrid[pos[0]][pos[1]] ? " fixed" : "");
                s.innerText = userEntry[i] || "";
                slots.appendChild(s);
            });

            const keys = document.getElementById('keysGrid'); keys.innerHTML = "";
            // توليد لوحة حروف ثابتة مبعثرة
            if (!currentQ.pool) {
                currentQ.pool = (currentQ.word + "نمتلوبج").split('').sort(() => Math.random() - 0.5);
            }

            currentQ.pool.forEach((l, idx) => {
                const b = document.createElement('div');
                b.className = 'key-btn';
                b.innerText = l;
                // إخفاء الحرف إذا كان مستخدماً في الإجابة الحالية (وليس من التقاطع)
                const usedCount = userEntry.filter((val, i) => val === l && !globalGrid[currentQ.cells[i][0]][currentQ.cells[i][1]]).length;
                const poolCount = currentQ.pool.slice(0, idx + 1).filter(x => x === l).length;
                if (poolCount <= usedCount) b.classList.add('used');

                b.onclick = () => {
                    const nextIdx = userEntry.findIndex(val => val === "");
                    if(nextIdx !== -1) {
                        userEntry[nextIdx] = l;
                        renderWaslaUI();
                        checkWasla();
                    }
                };
                keys.appendChild(b);
            });
        }

        function checkWasla() {
            if(!userEntry.includes("")) {
                if(userEntry.join('') === currentQ.word) {
                    alert("إجابة صحيحة! استمر في الحل.");
                    currentQ.cells.forEach((pos, i) => { globalGrid[pos[0]][pos[1]] = currentQ.word[i]; });
                    closeWasla(); initBoard();
                }
            }
        }

        function resetEntry() {
            currentQ.cells.forEach((pos, i) => {
                if (!globalGrid[pos[0]][pos[1]]) userEntry[i] = "";
            });
            renderWaslaUI();
        }

        function closeWasla() { 
            document.getElementById('modWasla').classList.remove('active'); 
            isModalOpen = false;
            currentQ = null;
        }

        // --- منطق المختبر الأصلي ---
        function startLab() {
            secretIon = ['كالسيوم', 'مغنيزيوم', 'بوتاسيوم'][Math.floor(Math.random()*3)];
            document.getElementById('liq').style.background = "rgba(255,255,255,0.2)";
            document.getElementById('prec').style.height = "0";
            nav('scrLab');
        }
        function addReagent(r) { 
            const liq = document.getElementById('liq'); liq.style.height = "50%"; 
            if(secretIon==='مغنيزيوم' && r==='NH3') {
                document.getElementById('prec').style.height = "25%";
                document.getElementById('prec').style.background = "white";
            }
        }
        function toggleHeat() {
            isHeating = !isHeating;
            document.getElementById('flame').classList.toggle('active', isHeating);
            if(isHeating && secretIon==='كالسيوم') {
                setTimeout(() => document.getElementById('liq').style.background = "#fca5a5", 1000);
            }
        }
        function diagnose() { alert("تم التشخيص! الشاردة هي: " + secretIon); startLab(); }
    </script>
</body>
</html>
