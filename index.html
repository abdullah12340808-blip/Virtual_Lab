<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>المخبر الافتراضي الذكي - جامعة حماه</title>
    <style>
        :root { --main-bg: #f4f7f6; --accent: #2c3e50; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--main-bg); margin: 0; padding: 10px; display: flex; justify-content: center; }
        .app-box { background: white; width: 100%; max-width: 450px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: var(--accent); color: white; padding: 15px; text-align: center; }
        .content { padding: 20px; }
        
        /* المحاكي */
        .lab-stage { height: 200px; background: #eef2f3; border-radius: 15px; position: relative; display: flex; justify-content: center; align-items: flex-end; margin-bottom: 20px; border: 2px inset #fff; }
        .tube { width: 45px; height: 150px; border: 3px solid #95a5a6; border-bottom-left-radius: 25px; border-bottom-right-radius: 25px; position: relative; background: rgba(255,255,255,0.5); z-index: 5; }
        .liquid { position: absolute; bottom: 0; width: 100%; height: 40%; background: rgba(52, 152, 219, 0.2); transition: 0.5s; }
        .precipitate { position: absolute; bottom: 0; width: 100%; height: 0%; transition: 0.8s; filter: blur(1px); border-radius: 0 0 20px 20px; }
        .fire { position: absolute; bottom: -5px; width: 40px; height: 70px; border-radius: 50% 50% 20% 20%; display: none; filter: blur(6px); z-index: 1; }

        /* الأسئلة والأزرار */
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { padding: 12px; border: none; border-radius: 10px; background: var(--accent); color: white; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { opacity: 0.9; }
        .status-card { background: #fff3e0; border-right: 5px solid #ff9800; padding: 12px; margin: 15px 0; font-size: 0.9rem; min-height: 40px; }
        .quiz-area { display: none; margin-top: 20px; border-top: 2px solid #eee; padding-top: 15px; }
        .hidden { display: none; }
        .score-box { font-weight: bold; color: #27ae60; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="app-box">
    <div class="header">
        <h3 style="margin:0">المخبر الافتراضي - اختبار الكفاءة</h3>
        <div id="score-display" class="score-box" style="color:white; font-size:0.8rem; margin-top:5px;">النقاط: 0</div>
    </div>

    <div class="content">
        <div id="start-screen">
            <p>أهلاً بك يا زميلي.. هذا الاختبار يتطلب دقة علمية. هل أنت مستعد؟</p>
            <button onclick="startChallenge()" style="width:100%; background:#27ae60;">ابدأ التحدي (عينة مجهولة)</button>
        </div>

        <div id="lab-screen" class="hidden">
            <div class="lab-stage">
                <div id="v-fire" class="fire"></div>
                <div class="tube">
                    <div class="liquid"></div>
                    <div id="v-prec" class="precipitate"></div>
                </div>
            </div>

            <div id="v-msg" class="status-card">لديك عينة مجهولة.. ابدأ بإضافة الكواشف للتعرف عليها.</div>

            <div class="btn-grid" id="controls">
                <button onclick="applyReagent('oxalate')">حماضات النشادر</button>
                <button onclick="applyReagent('phosphate')">فوسفات الصوديوم</button>
                <button onclick="applyReagent('hcl')">إضافة HCl</button>
                <button onclick="applyReagent('acetic')">حمض الخل</button>
                <button onclick="applyReagent('flame')" style="grid-column: span 2;">اختبار اللهب</button>
            </div>

            <div id="quiz-zone" class="quiz-area">
                <p id="question-text" style="font-weight:bold; color:#2c3e50;"></p>
                <div id="options" class="btn-grid"></div>
            </div>
            
            <button onclick="resetApp()" style="width:100%; margin-top:20px; background:#e74c3c;">إعادة المحاولة</button>
        </div>
    </div>
</div>

<script>
    let score = 0;
    let mysteryIon = ""; // Ca or Mg
    let currentStep = 0;

    function startChallenge() {
        mysteryIon = Math.random() > 0.5 ? "Ca" : "Mg";
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('lab-screen').classList.remove('hidden');
        score = 0;
        updateScore();
    }

    function applyReagent(type) {
        const prec = document.getElementById('v-prec');
        const msg = document.getElementById('v-msg');
        const fire = document.getElementById('v-fire');
        fire.style.display = "none";

        if (mysteryIon === "Ca") {
            if (type === 'oxalate') {
                prec.style.height = "45%"; prec.style.background = "white";
                msg.innerText = "تشكل راسب أبيض.. هل هو كالسيوم أم مغنيزيوم؟ اختبر الانحلال.";
                score += 10;
            } else if (type === 'hcl') {
                prec.style.height = "0%";
                msg.innerText = "انحل الراسب تماماً في حمض كلور الماء. هذا يؤكد وجود الكالسيوم!";
                showQuiz("ما هي أعراض نقص هذه الشاردة؟", ["تشنج عضلي وهشاشة", "إسهال مزمن", "فقدان سمع"], 0);
            } else if (type === 'flame') {
                fire.style.display = "block"; fire.style.background = "orange";
                msg.innerText = "لهب برتقالي! نتيجة مؤكدة للكالسيوم.";
                score += 15;
            } else if (type === 'acetic') {
                msg.innerText = "الراسب لم ينحل بحمض الخل! (تذكر: رواسب الكالسيوم لا تذوب في حمض الخل).";
            }
        } else {
            // منطق المغنيزيوم
            if (type === 'phosphate') {
                prec.style.height = "50%"; prec.style.background = "rgba(255,255,255,0.9)";
                msg.innerText = "راسب أبيض بلوري.. اختبر الانحلال في حمض الخل.";
                score += 10;
            } else if (type === 'acetic') {
                prec.style.height = "0%";
                msg.innerText = "انحل الراسب في حمض الخل! هذا يؤكد أنها شاردة المغنيزيوم.";
                showQuiz("أين يختزن معظم المغنيزيوم في الجسم؟", ["الكبد", "العظام", "الدماغ"], 1);
            } else if (type === 'flame') {
                msg.innerText = "لا يوجد تلون مميز للهب لهذه الشاردة.";
            }
        }
        updateScore();
    }

    function showQuiz(q, opts, correctIdx) {
        const zone = document.getElementById('quiz-zone');
        const qText = document.getElementById('question-text');
        const optGrid = document.getElementById('options');
        zone.style.display = "block";
        qText.innerText = q;
        optGrid.innerHTML = "";
        
        opts.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.innerText = opt;
            btn.onclick = () => {
                if (idx === correctIdx) {
                    alert("إجابة علمية صحيحة! +20 نقطة");
                    score += 20;
                } else {
                    alert("إجابة خاطئة.. راجع المحاضرة.");
                    score -= 5;
                }
                zone.style.display = "none";
                updateScore();
            };
            optGrid.appendChild(btn);
        });
    }

    function updateScore() {
        document.getElementById('score-display').innerText = "النقاط: " + score;
    }

    function resetApp() {
        location.reload();
    }
</script>

</body>
</html>
