<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>المخبر الافتراضي Pro</title>
  <style>
    :root {
      --bg: #050a14; --panel: #0f172a; --accent: #38bdf8; --success: #22c55e; --danger: #ef4444; --text: #f8fafc;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { 
      margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); 
      height: 100vh; overflow: hidden; touch-action: manipulation;
    }

    /* الأنبوب والبيئة المخبرية */
    .lab-stage {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      position: relative; background: radial-gradient(circle at center, #1e293b 0%, #050a14 100%);
    }
    
    .tube-holder { position: relative; width: 60px; height: 200px; z-index: 5; }
    .tube-body {
      position: absolute; inset: 0; border: 2px solid rgba(255,255,255,0.3);
      border-radius: 0 0 30px 30px; background: rgba(255,255,255,0.1);
      backdrop-filter: blur(2px); overflow: hidden; z-index: 2;
    }
    .liquid {
      position: absolute; bottom: 0; width: 100%; height: 0%;
      transition: all 1s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .precipitate {
      position: absolute; bottom: 0; width: 100%; height: 0%;
      background: #fff; filter: blur(2px); opacity: 0.8; transition: 1s;
    }
    
    /* اللهب */
    .fire {
      position: absolute; bottom: -40px; left: 50%; transform: translateX(-50%);
      width: 40px; height: 50px; background: orange; border-radius: 50% 50% 20% 20%;
      filter: blur(5px); opacity: 0; transition: 0.5s;
      animation: flicker 0.1s infinite alternate;
    }
    @keyframes flicker { from { height: 45px; opacity: 0.7; } to { height: 55px; opacity: 0.9; } }

    /* منطقة التحكم والسلايدر */
    .controls {
      background: var(--panel); border-radius: 30px 30px 0 0; padding: 20px 0;
      box-shadow: 0 -10px 30px rgba(0,0,0,0.5); z-index: 10;
    }
    .step-indicator { text-align: center; font-size: 14px; margin-bottom: 15px; color: var(--accent); }
    
    .slider-container {
      display: flex; gap: 12px; overflow-x: auto; padding: 0 20px 20px;
      scroll-snap-type: x mandatory; touch-action: pan-x; /* لمنع خروج التطبيق عند السحب الأفقي */
    }
    .slider-container::-webkit-scrollbar { display: none; }
    
    .option-card {
      flex: 0 0 70%; scroll-snap-align: center;
      background: #1e293b; border: 2px solid rgba(255,255,255,0.05);
      border-radius: 20px; padding: 20px; text-align: center;
      transition: 0.3s; font-size: 15px; min-height: 100px;
      display: flex; align-items: center; justify-content: center;
    }
    .option-card.correct { border-color: var(--success); background: rgba(34, 197, 94, 0.1); }
    .option-card.wrong { border-color: var(--danger); background: rgba(239, 68, 68, 0.1); }

    /* الأزرار العلوية */
    .nav-header {
      padding: 15px; display: flex; justify-content: space-between; align-items: center;
      background: var(--panel); border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .back-btn { 
      background: rgba(255,255,255,0.05); border: none; color: white; 
      padding: 8px 15px; border-radius: 10px; cursor: pointer;
    }

    .screen { display: none; height: 100%; flex-direction: column; }
    .screen.active { display: flex; }
    .menu-grid { padding: 20px; display: grid; gap: 15px; }
    .menu-item { 
      background: var(--panel); padding: 25px; border-radius: 20px; 
      text-align: center; border: 1px solid rgba(255,255,255,0.05);
    }
  </style>
</head>
<body>

  <div id="app" style="height: 100%; display: flex; flex-direction: column;">
    <div id="menuScreen" class="screen active">
        <div class="nav-header"><h1 style="font-size: 18px; margin:0;">المخبر الافتراضي</h1></div>
        <div id="menuContent" class="menu-grid"></div>
    </div>

    <div id="labScreen" class="screen">
        <div class="nav-header">
            <button class="back-btn" onclick="handleBack()">← عودة</button>
            <div id="labNavTitle" style="font-size: 14px; font-weight: bold;">تجربة</div>
        </div>
        
        <div class="lab-stage">
            <div id="labTargetHint" style="position:absolute; top:20px; padding:0 20px; text-align:center; color:var(--accent); font-size:14px;"></div>
            <div class="tube-holder">
                <div class="tube-body">
                    <div id="liquid" class="liquid"></div>
                    <div id="precip" class="precipitate"></div>
                </div>
                <div id="flame" class="fire"></div>
            </div>
            <div id="visualMsg" style="margin-top:30px; font-size:14px; color:#94a3b8;">الأنبوب جاهز</div>
        </div>

        <div class="controls">
            <div class="step-indicator" id="stepCounter">الخطوة 1 من 3</div>
            <div class="slider-container" id="optionsSlider"></div>
        </div>
    </div>
  </div>

  <script>
    // --- قسم الأدمن: إضافة التجارب هنا بسهولة ---
    const labWorkflows = {
      "الكيمياء صيدلية 1": [
        {
          title: "الكشف عن الكالسيوم",
          goal: "المطلوب: الكشف عن شوارد الكالسيوم بتشكيل راسب حماضات",
          steps: [
            {
              id: "s1",
              correctText: "إضافة 2 مل من محلول العينة (الكالسيوم)",
              wrongOptions: ["إضافة 10 مل ماء مقطر", "إضافة حمض كبريت مركز", "تسخين الأنبوب وهو فارغ"],
              effect: { h: "30%", c: "rgba(200,220,255,0.4)", msg: "تم وضع العينة" }
            },
            {
              id: "s2",
              correctText: "إضافة محلول حماضات النشادر",
              wrongOptions: ["إضافة كاشف فهلنغ", "إضافة نترات الفضة", "إضافة ميثيل برتقالي"],
              effect: { h: "45%", c: "#fff", p: "20%", msg: "تشكل راسب حماضات الكالسيوم الأبيض" }
            },
            {
              id: "s3",
              correctText: "إضافة حمض كلور الماء (HCl) للتأكد من الذوبان",
              wrongOptions: ["إضافة المزيد من الحماضات", "التبريد في حمام ثلجي", "إضافة محلول نشادر"],
              effect: { h: "55%", p: "0%", c: "rgba(255,255,255,0.2)", msg: "ذاب الراسب في الوسط الحمضي" }
            }
          ]
        }
      ]
    };

    const academicStructure = {
      "y2": { name: "السنة الثانية", t2: ["الكيمياء العضوية 2", "الكيمياء الحيوية 1", "العقاقير 1", "التحليلية 1", "الصيدلانيات 2"] },
      "y3": { name: "السنة الثالثة", t2: ["الدمويات", "كيمياء العقاقير", "الكيمياء صيدلية 1"] }
    };

    let state = { screen: 'main', year: null, sub: null, lab: null, stepIndex: 0 };

    function initMenu() {
        const content = document.getElementById('menuContent');
        content.innerHTML = "";
        if (!state.year) {
            Object.keys(academicStructure).forEach(y => {
                content.appendChild(createMenuItem(academicStructure[y].name, () => { state.year = y; initMenu(); }));
            });
        } else if (!state.sub) {
            academicStructure[state.year].t2.forEach(s => {
                content.appendChild(createMenuItem(s, () => { state.sub = s; initMenu(); }));
            });
        } else {
            const labs = labWorkflows[state.sub] || [];
            if(labs.length === 0) content.innerHTML = "<p>سيتم إضافة التجارب قريباً</p>";
            labs.forEach(l => {
                content.appendChild(createMenuItem(l.title, () => startLab(l)));
            });
        }
    }

    function createMenuItem(txt, fn) {
        const d = document.createElement('div'); d.className = 'menu-item';
        d.innerHTML = `<h3>${txt}</h3>`; d.onclick = fn; return d;
    }

    function startLab(lab) {
        state.lab = lab; state.stepIndex = 0;
        document.getElementById('menuScreen').classList.remove('active');
        document.getElementById('labScreen').classList.add('active');
        document.getElementById('labNavTitle').innerText = lab.title;
        document.getElementById('labTargetHint').innerText = lab.goal;
        resetLabVisuals();
        renderStep();
    }

    function renderStep() {
        const step = state.lab.steps[state.stepIndex];
        document.getElementById('stepCounter').innerText = `الخطوة ${state.stepIndex + 1} من ${state.lab.steps.length}`;
        
        const slider = document.getElementById('optionsSlider');
        slider.innerHTML = "";
        
        // دمج الخيار الصحيح مع الخيارات الخاطئة وبعثرتها
        let options = [
            { text: step.correctText, isCorrect: true },
            ...step.wrongOptions.map(o => ({ text: o, isCorrect: false }))
        ].sort(() => Math.random() - 0.5);

        options.forEach(opt => {
            const card = document.createElement('div');
            card.className = 'option-card';
            card.innerText = opt.text;
            card.onclick = () => handleChoice(opt, card);
            slider.appendChild(card);
        });
        slider.scrollLeft = 0;
    }

    function handleChoice(opt, el) {
        if (opt.isCorrect) {
            el.classList.add('correct');
            applyEffect(state.lab.steps[state.stepIndex].effect);
            state.stepIndex++;
            if (state.stepIndex < state.lab.steps.length) {
                setTimeout(renderStep, 1000);
            } else {
                document.getElementById('visualMsg').innerText = "تمت التجربة بنجاح! 🌟";
                document.getElementById('visualMsg').style.color = "var(--success)";
            }
        } else {
            el.classList.add('wrong');
            document.getElementById('visualMsg').innerText = "خطأ! فكر جيداً في الخطوة العلمية الصحيحة.";
            document.getElementById('visualMsg').style.color = "var(--danger)";
            setTimeout(() => {
                el.classList.remove('wrong');
                document.getElementById('visualMsg').innerText = "حاول مجدداً...";
                document.getElementById('visualMsg').style.color = "#94a3b8";
            }, 1500);
        }
    }

    function applyEffect(eff) {
        if (eff.h) document.getElementById('liquid').style.height = eff.h;
        if (eff.c) document.getElementById('liquid').style.background = eff.c;
        if (eff.p !== undefined) document.getElementById('precip').style.height = eff.p;
        if (eff.msg) document.getElementById('visualMsg').innerText = eff.msg;
        if (eff.fire) document.getElementById('flame').style.opacity = "1";
        else document.getElementById('flame').style.opacity = "0";
    }

    function handleBack() {
        if (state.lab) {
            state.lab = null;
            document.getElementById('labScreen').classList.remove('active');
            document.getElementById('menuScreen').classList.add('active');
        } else if (state.sub) {
            state.sub = null;
        } else if (state.year) {
            state.year = null;
        }
        initMenu();
    }

    function resetLabVisuals() {
        document.getElementById('liquid').style.height = "0%";
        document.getElementById('precip').style.height = "0%";
        document.getElementById('flame').style.opacity = "0";
        document.getElementById('visualMsg').innerText = "الأنبوب جاهز";
        document.getElementById('visualMsg').style.color = "#94a3b8";
    }

    initMenu();
  </script>
</body>
</html>
