<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الكلمات المتقاطعة - الدمويات</title>
    <style>
        /* =========================================
           التصميم والرسوميات (CSS)
           ========================================= */
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }

        /* إدارة الواجهات وانتقالاتها */
        .screen {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
            position: absolute;
        }
        .hidden {
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
            z-index: -1;
        }
        .active {
            opacity: 1;
            transform: scale(1);
            z-index: 1;
        }

        /* الأزرار */
        button {
            font-family: 'Tajawal', sans-serif;
            font-size: 18px;
            font-weight: bold;
            padding: 15px 20px;
            margin: 10px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.2s, background 0.2s;
        }
        button:active {
            transform: scale(0.95);
        }
        .main-btn { background-color: #ff9800; color: white; width: 90%; }
        .cat-btn { background-color: #4CAF50; color: white; width: 80%; }
        .back-btn { background-color: #f44336; color: white; font-size: 14px; padding: 10px; margin-top: 20px; width: 50%;}

        /* واجهة السؤال */
        .question-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        .question-box img {
            max-width: 100%;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        /* خانات الأحرف */
        .slots-container {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            flex-direction: row-reverse; /* لترتيب الأحرف من اليمين لليسار */
        }
        .letter-slot {
            display: inline-block;
            width: 40px;
            height: 40px;
            line-height: 40px;
            background: white;
            color: #1e3c72;
            margin: 5px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
        }

        /* الحروف العشوائية */
        .letters-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
        }
        .pool-letter {
            display: inline-block;
            width: 40px;
            height: 40px;
            line-height: 40px;
            background: #ff9800;
            color: white;
            margin: 5px;
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 3px 5px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div id="screen-start" class="screen active">
        <h1>مرحباً بك في المختبر</h1>
        <button onclick="goToScreen('screen-categories')" class="main-btn">
            اختبار الكلمات المتقاطعة لملحق الدمويات
        </button>
    </div>

    <div id="screen-categories" class="screen hidden">
        <h2>اختر نوع اللغز</h2>
        <button onclick="startPuzzle('لغز عام')" class="cat-btn">1- لغز عام</button>
        <button onclick="startPuzzle('لغز المصطلحات')" class="cat-btn">2- لغز المصطلحات</button>
        <button onclick="goToScreen('screen-start')" class="back-btn">عودة للبداية</button>
    </div>

    <div id="screen-question" class="screen hidden">
        <div class="question-box">
            <img id="q-image" src="" alt="صورة توضيحية" style="display:none;">
            <p id="q-text">نص السؤال سيظهر هنا</p>
        </div>
        
        <div id="answer-slots" class="slots-container"></div>
        
        <div id="letters-pool" class="letters-container"></div>

        <button onclick="goToScreen('screen-categories')" class="back-btn">عودة للألغاز</button>
    </div>

    <script>
        // 1. البيانات (الأسئلة): يمكنك إضافة الأسئلة هنا بسهولة مستقبلاً
        const questionsData = {
            "لغز المصطلحات": [
                {
                    question: "بروتين غني بالحديد يتواجد في كريات الدم الحمراء ومسؤول عن نقل الأكسجين",
                    answer: "هيموغلوبين",
                    image: "" // ضع مسار الصورة هنا مثل "images/blood.png" إذا أردت
                }
            ],
            "لغز عام": [
                {
                    question: "ما هو السائل الذي يسبح فيه الدم؟",
                    answer: "بلازما",
                    image: ""
                }
            ]
        };

        // 2. دالة الانتقال بين الشاشات
        function goToScreen(screenId) {
            // إخفاء كل الشاشات
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
                screen.classList.add('hidden');
            });
            // إظهار الشاشة المطلوبة
            const targetScreen = document.getElementById(screenId);
            targetScreen.classList.remove('hidden');
            targetScreen.classList.add('active');
        }

        // 3. دالة بدء اللغز (تأخذنا مباشرة للسؤال للتجربة المبدئية)
        function startPuzzle(categoryName) {
            goToScreen('screen-question');
            
            // جلب السؤال الأول من القسم المختار كعينة
            const currentQuestion = questionsData[categoryName][0];
            setupQuestionView(currentQuestion);
        }

        let currentSlotIndex = 0; // متغیر لتتبع الخانة الحالية المفتوحة

        // 4. دالة تجهيز واجهة السؤال
        function setupQuestionView(data) {
            currentSlotIndex = 0; // تصفير المؤشر عند بدء سؤال جديد

            // إعداد النص والصورة
            document.getElementById('q-text').innerText = data.question;
            const imgEl = document.getElementById('q-image');
            if(data.image && data.image !== "") {
                imgEl.src = data.image;
                imgEl.style.display = "block";
            } else {
                imgEl.style.display = "none";
            }

            // إعداد خانات الإجابة
            const slotsContainer = document.getElementById('answer-slots');
            slotsContainer.innerHTML = '';
            for(let i = 0; i < data.answer.length; i++) {
                slotsContainer.innerHTML += `<div class="letter-slot" id="slot-${i}"></div>`;
            }

            // إعداد الحروف العشوائية للحل
            const poolContainer = document.getElementById('letters-pool');
            poolContainer.innerHTML = '';
            
            // خربطة حروف الكلمة كبداية
            let letters = data.answer.split('').sort(() => Math.random() - 0.5);
            
            letters.forEach(letter => {
                poolContainer.innerHTML += `<div class="pool-letter" onclick="selectLetter(this)">${letter}</div>`;
            });
        }

        // 5. دالة عند الضغط على أحد الحروف المبعثرة
        function selectLetter(element) {
            const letter = element.innerText;
            const slot = document.getElementById(`slot-${currentSlotIndex}`);
            
            // إذا كان هناك خانة فارغة متبقية
            if(slot) {
                slot.innerText = letter; // نقل الحرف للخانة
                element.style.visibility = 'hidden'; // إخفاء الحرف من السلة السفلية
                currentSlotIndex++; // الانتقال للخانة التالية
            }
        }
    </script>
</body>
</html>
