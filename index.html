<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>المخبر الافتراضي - جامعة حماة</title>
  <style>
    :root { --bg: #050a14; --panel: #0f172a; --accent: #38bdf8; --success: #22c55e; --danger: #ef4444; --text: #f8fafc; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

    /* الشاشات */
    .screen { display: none; height: 100vh; flex-direction: column; animation: fadeIn 0.3s ease; }
    .screen.active { display: flex; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* الهيدر */
    .header { background: var(--panel); padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 15px; }
    .btn-back { background: rgba(255,255,255,0.1); border: none; color: white; padding: 8px 15px; border-radius: 10px; cursor: pointer; }

    /* القوائم */
    .menu-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px; overflow-y: auto; }
    .btn-main { 
      width: 100%; max-width: 320px; background: var(--panel); border: 1px solid rgba(255,255,255,0.1); 
      padding: 20px; border-radius: 18px; text-align: center; font-size: 16px; font-weight: bold; cursor: pointer; 
    }
    .btn-main:active { background: var(--accent); color: #000; }

    /* المختبر */
    .lab-stage { flex: 1; position: relative; background: radial-gradient(circle, #1e293b, #050a14); display: flex; align-items: center; justify-content: center; overflow: hidden; }
    
    /* اللهب */
    .burner-unit { position: absolute; left: 30px; bottom: 80px; text-align: center; }
    .fire { width: 35px; height: 50px; background: linear-gradient(to top, #ff4d00, #ffcc00, #fff); border-radius: 50% 50% 20% 20%; filter: blur(2px); opacity: 0; }
    .fire.active { opacity: 1; animation: flicker 0.1s infinite alternate; }
    @keyframes flicker { from { transform: scale(1); } to { transform: scale(1.1); } }

    /* الأنبوب */
    #tube { width: 55px; height: 160px; position: relative; transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); z-index: 50; }
    .tube-glass { position: absolute; inset: 0; border: 2.5px solid rgba(255,255,255,0.4); border-radius: 0 0 25px 25px; background: rgba(255,255,255,0.1); backdrop-filter: blur(4px); overflow: hidden; }
    .liquid { position: absolute; bottom: 0; width: 100%; height: 0%; transition: 1s; }
    .precipitate { position: absolute; bottom: 0; width: 100%; height: 0%; background: #fff; filter: blur(1px); opacity: 0; transition: 1s; }

    /* سهم الحركة */
    #moveBtn {
      position: absolute; right: 40px; bottom: 50%; background: var(--accent); color: #000;
      width: 50px; height: 50px; border-radius: 50%; display: none; align-items: center; justify-content: center;
      font-weight: bold; font-size: 24px; box-shadow: 0 0 20px var(--accent); animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }

    .controls { background: var(--panel); padding: 20px; border-radius: 25px 25px 0 0; display: flex; flex-direction: column; align-items: center; }
    .opt-btn { background: #1e293b; border: 1px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 12px; color: white; width: 100%; max-width: 300px; margin-bottom: 8px; text-align: center; }
  </style>
</head>
<body>

<div id="app">
    <div id="screenStart" class="screen active" style="justify-content: center; align-items: center;">
        <h1 style="color: var(--accent);">المخبر الافتراضي</h1>
        <p style="color: #94a3b8; margin-bottom: 40px;">جامعة حماة - كلية الصيدلة</p>
        <button class="btn-main" onclick="nav('screenYears')" style="background: var(--accent); color: #000;">لنبدأ</button>
    </div>

    <div id="screenYears" class="screen">
        <div class="header"><span>اختر السنة</span></div>
        <div class="menu-container">
            <div class="btn-main" onclick="openYear('y2')">السنة الثانية</div>
            <div class="btn-main" onclick="openYear('y3')">السنة الثالثة</div>
        </div>
    </div>

    <div id="screenSubs" class="screen">
        <div class="header"><button class="btn-back" onclick="nav('screenYears')">←</button><span id="txtYear"></span></div>
        <div class="menu-container" id="listSubs"></div>
    </div>

    <div id="screenSessions" class="screen">
        <div class="header"><button class="btn-back" onclick="nav('screenSubs')">←</button><span id="txtSub"></span></div>
        <div class="menu-container" id="listSessions"></div>
    </div>

    <div id="screenTests" class="screen">
        <div class="header"><button class="btn-back" onclick="nav('screenSessions')">←</button><span id="txtSess"></span></div>
        <div class="menu-container" id="listTests"></div>
    </div>

    <div id="screenLab" class="screen">
        <div class="header"><button class="btn-back" onclick="nav('screenTests')">← خروج</button><span id="txtTest"></span></div>
        <div class="lab-stage">
            <div class="burner-unit">
                <div id="flame" class="fire"></div>
                <div style="width:40px; height:8px; background:#334155; border-radius:4px;"></div>
            </div>
            <div id="tube"><div class="tube-glass"><div id="liq" class="liquid"></div><div id="pre" class="precipitate"></div></div></div>
            <div id="moveBtn" onclick="moveTubeToFire()">←</div>
            <div id="labHint" style="position:absolute; top:20px; color:var(--accent); font-size:14px; text-align:center; padding:0 20px;"></div>
        </div>
        <div class="controls">
            <div id="options"></div>
            <div id="status" style="font-size: 12px; color: #94a3b8; margin-top: 10px;">جاهز</div>
        </div>
    </div>
</div>

<script>
    const db = {
        y2: { name: "السنة الثانية", subs: ["العضوية 2", "الحيوية 1", "العقاقير 1", "التحليلية 1", "الصيدلانيات 2"] },
        y3: { name: "السنة الثالثة", subs: ["الدمويات", "الكيمياء الصيدلية 1", "التحليل الآلي", "الأحياء 2", "كيمياء العقاقير", "فارماكولوجي 2"] }
    };

    const sessData = {
        "الكيمياء الصيدلية 1": [{ id: "cs1_s1", name: "الجلسة الأولى: الكشف عن الشوارد الموجبة 1" }]
    };

    const testsData = {
        "cs1_s1": [
            { 
                title: "الكشف عن الكالسيوم (Ca++)", 
                steps: [
                    { q: "إضافة عينة الكالسيوم (2 مل)", w: ["إضافة حمض نمل", "إضافة ماء"], e: { h: "25%", c: "rgba(255,255,255,0.2)", m: "تم وضع العينة" } },
                    { q: "إضافة حمض HCl للتحميض", w: ["إضافة نشادر", "إضافة سكر"], e: { h: "40%", m: "تم التحميض.. الآن يجب التسخين" } },
                    { q: "انقر على السهم لتحريك الأنبوب نحو اللهب", w: [], e: { fire: true }, isHeat: true },
                    { q: "ملاحظة تلون اللهب بالبرتقالي", w: ["لون أزرق", "لون أخضر"], e: { m: "تم الكشف بنجاح! 🎉" } }
                ]
            }
        ]
    };

    let cur = { step: 0, test: null };

    function nav(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function openYear(y) {
        document.getElementById('txtYear').innerText = db[y].name;
        const list = document.getElementById('listSubs'); list.innerHTML = "";
        db[y].subs.forEach(s => {
            const btn = document.createElement('div'); btn.className = 'btn-main';
            btn.innerText = s; btn.onclick = () => openSub(s); list.appendChild(btn);
        });
        nav('screenSubs');
    }

    function openSub(sub) {
        document.getElementById('txtSub').innerText = sub;
        const list = document.getElementById('listSessions'); list.innerHTML = "";
        if (!sessData[sub]) list.innerHTML = "سيتم الإضافة قريباً";
        else sessData[sub].forEach(sess => {
            const btn = document.createElement('div'); btn.className = 'btn-main';
            btn.innerText = sess.name; btn.onclick = () => openTests(sess); list.appendChild(btn);
        });
        nav('screenSessions');
    }

    function openTests(sess) {
        document.getElementById('txtSess').innerText = sess.name;
        const list = document.getElementById('listTests'); list.innerHTML = "";
        (testsData[sess.id] || []).forEach(t => {
            const btn = document.createElement('div'); btn.className = 'btn-main';
            btn.innerText = t.title; btn.onclick = () => startLab(t); list.appendChild(btn);
        });
        nav('screenTests');
    }

    function startLab(t) {
        cur.test = t; cur.step = 0;
        document.getElementById('txtTest').innerText = t.title;
        resetLab(); renderStep(); nav('screenLab');
    }

    function renderStep() {
        const step = cur.test.steps[cur.step];
        const box = document.getElementById('options'); box.innerHTML = "";
        document.getElementById('moveBtn').style.display = step.isHeat ? "flex" : "none";

        if (!step.isHeat) {
            let opts = [{ t: step.q, ok: true }, ...step.w.map(x => ({ t: x, ok: false }))].sort(() => Math.random() - 0.5);
            opts.forEach(o => {
                const b = document.createElement('div'); b.className = 'opt-btn'; b.innerText = o.t;
                b.onclick = () => {
                    if (o.ok) { apply(step.e); cur.step++; if(cur.step < cur.test.steps.length) setTimeout(renderStep, 800); }
                    else { document.getElementById('status').innerText = "خطأ!"; b.style.borderColor = "red"; }
                };
                box.appendChild(b);
            });
        } else {
            document.getElementById('status').innerText = "اضغط على السهم للتحريك نحو اللهب";
            apply(step.e);
        }
    }

    function moveTubeToFire() {
        const tube = document.getElementById('tube');
        tube.style.transform = "translateX(-120px)";
        document.getElementById('status').innerText = "يتم التسخين الآن...";
        setTimeout(() => {
            tube.style.transform = "translateX(0)";
            cur.step++; renderStep();
        }, 2000);
    }

    function apply(e) {
        if (e.h) document.getElementById('liq').style.height = e.h;
        if (e.c) document.getElementById('liq').style.background = e.c;
        if (e.m) document.getElementById('status').innerText = e.m;
        if (e.fire) document.getElementById('flame').classList.add('active');
        else document.getElementById('flame').classList.remove('active');
    }

    function resetLab() {
        document.getElementById('liq').style.height = "0%";
        document.getElementById('tube').style.transform = "translateX(0)";
        document.getElementById('flame').classList.remove('active');
    }
</script>
</body>
</html>
