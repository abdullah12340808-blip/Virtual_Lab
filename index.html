<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المخبر الافتراضي التعليمي - جامعة حماة</title>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --accent: #38bdf8; --success: #22c55e; --danger: #f43f5e; --text: #f8fafc; --gold: #fbbf24; } 
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; } 
        body { margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; } 

        .screen { display: none; height: 100vh; flex-direction: column; animation: fadeIn 0.3s ease; } 
        .screen.active { display: flex; } 
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } } 

        .header { background: var(--panel); padding: 15px; border-bottom: 2px solid var(--accent); display: flex; align-items: center; gap: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 10; } 
        .btn-back { background: rgba(255,255,255,0.1); border: 1px solid var(--accent); color: white; padding: 5px 12px; border-radius: 8px; cursor: pointer; } 

        .menu-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px; overflow-y: auto; } 
        .btn-main { width: 100%; max-width: 340px; background: linear-gradient(135deg, #1e293b, #334155); border: 1px solid rgba(255,255,255,0.1); padding: 18px; border-radius: 12px; text-align: center; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; color: white; } 
        .btn-main:active { transform: scale(0.97); background: var(--accent); color: #000; } 

        /* لقطة المختبر */
        .lab-stage { flex: 1; position: relative; background: radial-gradient(circle, #1e293b, #0f172a); display: flex; align-items: center; justify-content: center; } 
        #tube { width: 50px; height: 160px; border: 3px solid rgba(255,255,255,0.3); border-radius: 0 0 25px 25px; position: relative; background: rgba(255,255,255,0.05); } 
        .liquid { position: absolute; bottom: 0; width: 100%; height: 30%; background: rgba(255,255,255,0.2); transition: 1s; border-radius: 0 0 22px 22px; }

        /* نظام وصلة (الأحياء) */
        .wasla-q-box { background: var(--panel); border-radius: 15px; padding: 15px; text-align: center; width: 90%; max-width: 400px; margin-bottom: 10px; border: 1px solid var(--accent); }
        .wasla-img { width: 150px; height: 150px; border-radius: 10px; margin-bottom: 10px; background: white; object-fit: contain; }
        .answer-container { display: flex; gap: 5px; margin: 15px 0; justify-content: center; flex-wrap: wrap; }
        .ans-box { width: 35px; height: 35px; border: 2px solid #334155; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-weight: bold; background: #0f172a; cursor: pointer; }
        .ans-box.filled { border-color: var(--accent); color: var(--accent); }
        .letter-bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 320px; }
        .letter-btn { width: 38px; height: 38px; background: #334155; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; }
        .letter-btn.hidden { visibility: hidden; pointer-events: none; }
        .letter-btn:active { background: var(--accent); color: black; }
    </style>
</head>
<body>

    <div id="scrLogin" class="screen active">
        <div class="header">🔬 المخبر الافتراضي</div>
        <div class="menu-container">
            <h2 style="margin:0">جامعة حماة</h2>
            <p style="margin-top:0; opacity:0.7">كلية الصيدلة</p>
            <div class="btn-main" onclick="nav('scrYears')">دخول الطالب</div>
        </div>
    </div>

    <div id="scrYears" class="screen">
        <div class="header"><button class="btn-back" onclick="nav('scrLogin')">←</button> اختر السنة</div>
        <div class="menu-container">
            <div class="btn-main" onclick="showTerms('y2')">السنة الثانية</div>
            <div class="btn-main" onclick="showTerms('y3')">السنة الثالثة</div>
            <div class="btn-main" style="opacity:0.5">السنة الرابعة (قريباً)</div>
        </div>
    </div>

    <div id="scrTerms" class="screen">
        <div class="header"><button class="btn-back" onclick="nav('scrYears')">←</button> <span id="termTitle"></span></div>
        <div class="menu-container">
            <div class="btn-main" onclick="showSubs(1)">الفصل الأول</div>
            <div class="btn-main" onclick="showSubs(2)">الفصل الثاني</div>
        </div>
    </div>

    <div id="scrSubs" class="screen">
        <div class="header"><button class="btn-back" onclick="nav('scrTerms')">←</button> المواد المتاحة</div>
        <div class="menu-container" id="subList"></div>
    </div>

    <div id="scrSessions" class="screen">
        <div class="header"><button class="btn-back" onclick="nav('scrSubs')">←</button> <span id="sessTitle"></span></div>
        <div class="menu-container" id="sessList"></div>
    </div>

    <div id="scrWasla" class="screen">
        <div class="header"><button class="btn-back" onclick="nav('scrSessions')">←</button> اختبار كلمات متقاطعة</div>
        <div class="menu-container">
            <div class="wasla-q-box">
                <img id="qImg" class="wasla-img" src="" alt="تخطيط">
                <div style="font-size:14px">ما هو نوع التخطيط الموضح؟</div>
                <div class="answer-container" id="ansRow"></div>
            </div>
            <div class="letter-bank" id="bank"></div>
            <div id="feedback" style="margin-top:10px; font-weight:bold"></div>
        </div>
    </div>

    <div id="scrLab" class="screen">
        <div class="header"><button class="btn-back" onclick="nav('scrSessions')">←</button> كشف مجهول</div>
        <div class="lab-stage">
            <div id="tube"><div id="liq" class="liquid"></div></div>
        </div>
        <div style="padding:20px; background:var(--panel);">
            <div class="btn-main" onclick="alert('تمت إضافة الكاشف')" style="margin-bottom:10px">إضافة HCl</div>
            <div class="btn-main" onclick="nav('scrSessions')" style="background:var(--success)">إنهاء التجربة</div>
        </div>
    </div>

    <script>
        // نظام الملاحة الأساسي - يعمل فوراً
        function nav(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            const target = document.getElementById(id);
            if(target) target.classList.add('active');
        }

        const data = {
            y2: { t1: ["عضوية 1", "فيزيائية"], t2: ["عضوية 2", "تحليلية 1"] },
            y3: { t1: ["أحياء 1", "عقاقير 2"], t2: ["الأحياء 2", "كيمياء صيدلية 1", "دمويات"] }
        };

        let currentYear = "";
        let currentTerm = 1;

        function showTerms(y) {
            currentYear = y;
            document.getElementById('termTitle').innerText = y === 'y2' ? "السنة الثانية" : "السنة الثالثة";
            nav('scrTerms');
        }

        function showSubs(t) {
            currentTerm = t;
            const list = document.getElementById('subList');
            list.innerHTML = "";
            data[currentYear]['t' + t].forEach(sub => {
                const b = document.createElement('div');
                b.className = 'btn-main';
                b.innerText = sub;
                b.onclick = () => showSessions(sub);
                list.appendChild(b);
            });
            nav('scrSubs');
        }

        function showSessions(sub) {
            document.getElementById('sessTitle').innerText = sub;
            const list = document.getElementById('sessList');
            list.innerHTML = "";
            
            let sessions = [];
            if(sub === "الأحياء 2") {
                sessions = [{n: "اختبار كلمات متقاطعة", type: "wasla"}];
            } else if(sub === "كيمياء صيدلية 1") {
                sessions = [{n: "كشف الشوارد المجهولة", type: "lab"}];
            } else {
                sessions = [{n: "الجلسة الأولى (نظري)", type: "msg"}];
            }

            sessions.forEach(s => {
                const b = document.createElement('div');
                b.className = 'btn-main';
                b.innerText = s.n;
                b.onclick = () => {
                    if(s.type === "wasla") startWasla();
                    else if(s.type === "lab") nav('scrLab');
                    else alert("هذه الجلسة قيد التجهيز");
                };
                list.appendChild(b);
            });
            nav('scrSessions');
        }

        // --- منطق لعبة وصلة (الأحياء 2) ---
        const waslaData = [
            { a: "استمراري", img: "https://i.ibb.co/LzNf9Xp/image.png" },
            { a: "إشعاعي", img: "https://i.ibb.co/vYm0f4g/image.png" },
            { a: "حرفT", img: "https://i.ibb.co/Zz6m7qf/image.png" },
            { a: "أربع حجرات", img: "https://i.ibb.co/SrtpY2k/image.png" }
        ];

        let qIdx = 0;
        let userAns = [];

        function startWasla() {
            qIdx = 0;
            loadQuestion();
            nav('scrWasla');
        }

        function loadQuestion() {
            const q = waslaData[qIdx];
            userAns = new Array(q.a.replace(" ", "").length).fill("");
            document.getElementById('qImg').src = q.img;
            document.getElementById('feedback').innerText = "";
            renderWasla();
        }

        function renderWasla() {
            const q = waslaData[qIdx];
            const cleanA = q.a.replace(" ", "");
            
            // مربعات الإجابة
            const row = document.getElementById('ansRow');
            row.innerHTML = "";
            userAns.forEach((char, i) => {
                const box = document.createElement('div');
                box.className = "ans-box " + (char ? "filled" : "");
                box.innerText = char;
                box.onclick = () => removeLetter(i);
                row.appendChild(box);
            });

            // بنك الحروف
            const bank = document.getElementById('bank');
            bank.innerHTML = "";
            const pool = (cleanA + "وبجمنتك").split("").sort();
            pool.forEach((l, i) => {
                const btn = document.createElement('div');
                btn.className = "letter-btn";
                btn.innerText = l;
                btn.onclick = () => addLetter(l, btn);
                bank.appendChild(btn);
            });
        }

        function addLetter(l, btn) {
            const emptyIdx = userAns.indexOf("");
            if(emptyIdx !== -1) {
                userAns[emptyIdx] = l;
                btn.classList.add('hidden');
                btn.dataset.index = emptyIdx;
                renderWaslaStatus();
                checkWin();
            }
        }

        function removeLetter(i) {
            if(userAns[i] !== "") {
                const letter = userAns[i];
                userAns[i] = "";
                // إظهار الحرف في البنك مجدداً
                const buttons = document.querySelectorAll('.letter-btn.hidden');
                for(let b of buttons) {
                    if(b.innerText === letter) {
                        b.classList.remove('hidden');
                        break;
                    }
                }
                renderWaslaStatus();
            }
        }

        function renderWaslaStatus() {
            const boxes = document.querySelectorAll('.ans-box');
            userAns.forEach((char, i) => {
                boxes[i].innerText = char;
                boxes[i].className = "ans-box " + (char ? "filled" : "");
            });
        }

        function checkWin() {
            if(!userAns.includes("")) {
                const q = waslaData[qIdx];
                if(userAns.join("") === q.a.replace(" ", "")) {
                    document.getElementById('feedback').innerText = "✅ صحيح!";
                    document.getElementById('feedback').style.color = "var(--success)";
                    setTimeout(() => {
                        qIdx++;
                        if(qIdx < waslaData.length) loadQuestion();
                        else alert("أحسنت! أنهيت جميع الأسئلة.");
                    }, 1000);
                } else {
                    document.getElementById('feedback').innerText = "❌ حاول مرة أخرى";
                    document.getElementById('feedback').style.color = "var(--danger)";
                }
            }
        }
    </script>
</body>
</html>
