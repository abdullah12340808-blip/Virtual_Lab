<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>المخبر الافتراضي - جامعة حماه</title>
    <style>
        :root { --primary: #2c3e50; --bg: #f1f3f5; }
        body { font-family: 'Arial', sans-serif; background: var(--bg); margin: 0; padding: 10px; display: flex; justify-content: center; }
        .app-card { background: white; width: 100%; max-width: 420px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); overflow: hidden; }
        .header { background: var(--primary); color: white; padding: 15px; text-align: center; }
        .content { padding: 15px; }
        
        /* المسرح المخبري */
        .lab-stage { height: 180px; background: #dfe6e9; border-radius: 10px; position: relative; display: flex; justify-content: center; align-items: flex-end; margin-bottom: 15px; }
        .tube { width: 45px; height: 140px; border: 3px solid #636e72; border-bottom-left-radius: 22px; border-bottom-right-radius: 22px; position: relative; background: rgba(255,255,255,0.4); z-index: 5; }
        .liquid { position: absolute; bottom: 0; width: 100%; height: 40%; background: rgba(116, 185, 255, 0.3); transition: 0.5s; }
        .precipitate { position: absolute; bottom: 0; width: 100%; height: 0%; transition: 0.7s; border-radius: 0 0 20px 20px; filter: blur(1px); }
        .flame-box { position: absolute; bottom: -10px; width: 40px; height: 60px; display: none; filter: blur(5px); z-index: 1; }

        /* الأزرار والنظام */
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        button { padding: 12px; border: none; border-radius: 8px; background: var(--primary); color: white; cursor: pointer; font-weight: bold; font-size: 14px; -webkit-tap-highlight-color: transparent; }
        .msg-box { background: #fff9db; border-right: 4px solid #fcc419; padding: 10px; margin-bottom: 15px; min-height: 40px; font-size: 13px; font-weight: bold; }
        .quiz-box { display: none; background: #e7f5ff; padding: 15px; border-radius: 10px; margin-top: 10px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="app-card">
    <div class="header">
        <h4 style="margin:0">اختبار المخبر الافتراضي الذكي</h4>
        <div id="points" style="font-size:12px; margin-top:5px;">الرصيد: 0 نقطة</div>
    </div>

    <div class="content" id="app-body">
        <div id="start-view">
            <p style="font-size:14px; line-height:1.6;">سيعطيك النظام عينة مجهولة. عليك استخدام الكواشف لمعرفتها والإجابة على الأسئلة العلمية من المحاضرة.</p>
            <button id="btn-start" style="width:100%; background:#2f9e44;">دخول المخبر (عينة مجهولة)</button>
        </div>

        <div id="lab-view" class="hidden">
            <div class="lab-stage">
                <div id="flame" class="flame-box"></div>
                <div class="tube">
                    <div class="liquid"></div>
                    <div id="prec" class="precipitate"></div>
                </div>
            </div>

            <div id="status" class="msg-box">لديك عينة مجهولة.. ابدأ التحليل المخبري.</div>

            <div class="controls">
                <button data-action="oxalate">حماضات النشادر</button>
                <button data-action="phosphate">فوسفات الصوديوم</button>
                <button data-action="hcl">إضافة HCl</button>
                <button data-action="acetic">حمض الخل</button>
                <button data-action="flame-test" style="grid-column: span 2; background:#e67e22;">اختبار اللهب</button>
            </div>

            <div id="quiz-ui" class="quiz-box">
                <p id="q-text" style="font-size:14px; margin-top:0;"></p>
                <div id="q-options" class="controls"></div>
            </div>

            <button id="btn-reset" style="width:100%; margin-top:15px; background:#e03131;">إعادة الاختبار</button>
        </div>
    </div>
</div>

<script>
    let mysteryIon = ""; 
    let points = 0;

    // محرك الأزرار الشامل لضمان العمل على كل الأجهزة
    document.addEventListener('click', function (e) {
        const action = e.target.getAttribute('data-action');
        const id = e.target.id;

        if (id === 'btn-start') startExperiment();
        if (id === 'btn-reset') location.reload();
        
        if (action) handleChemicalAction(action);
    });

    function startExperiment() {
        mysteryIon = Math.random() > 0.5 ? "Ca" : "Mg";
        document.getElementById('start-view').classList.add('hidden');
        document.getElementById('lab-view').classList.remove('hidden');
    }

    function handleChemicalAction(action) {
        const p = document.getElementById('prec');
        const s = document.getElementById('status');
        const f = document.getElementById('flame');
        f.style.display = "none";

        if (mysteryIon === "Ca") {
            if (action === 'oxalate') {
                p.style.height = "45%"; p.style.background = "white";
                [span_1](start_span)s.innerText = "تشكل راسب أبيض. هل ينحل بحمض الخل أم HCl؟[span_1](end_span)";
            } else if (action === 'hcl') {
                p.style.height = "0%";
                s.innerText = "انحل الراسب تماماً! [span_2](start_span)هذا يؤكد أنها شاردة الكالسيوم.[span_2](end_span)";
                [span_3](start_span)askQuestion("ما هو الفيتامين الضروري لامتصاص الكالسيوم؟[span_3](end_span)", ["فيتامين C", "فيتامين D", "فيتامين A"], 1);
            } else if (action === 'flame-test') {
                f.style.display = "block"; f.style.background = "orange";
                s.innerText = "تلوين اللهب باللون البرتقالي! [span_4](start_span)نتيجة مؤكدة للكالسيوم.[span_4](end_span)";
            } else if (action === 'acetic') {
                s.innerText = "الراسب لا ينحل بحمض الخل. (معلومة صحيحة للكالسيوم) [span_5](start_span)";
            }
        } else {
            if (action === 'phosphate') {
                p.style.height = "50%"; p.style.background = "white";
                s.innerText = "راسب أبيض بلوري من فوسفات الأمونيوم والمغنيزيوم.[span_5](end_span)";
            } else if (action === 'acetic') {
                p.style.height = "0%";
                s.innerText = "انحل الراسب في حمض الخل! [span_6](start_span)العينة هي مغنيزيوم بالتأكيد.[span_6](end_span)";
                [span_7](start_span)askQuestion("أين يختزن معظم المغنيزيوم في الجسم؟[span_7](end_span)", ["الكبد", "العظام", "القلب"], 1);
            } else if (action === 'flame-test') {
                [span_8](start_span)s.innerText = "لا يوجد تلون مميز للهب للمغنيزيوم.[span_8](end_span)";
            }
        }
    }

    function askQuestion(q, options, correct) {
        const box = document.getElementById('quiz-ui');
        const text = document.getElementById('q-text');
        const opts = document.getElementById('q-options');
        box.style.display = "block";
        text.innerText = q;
        opts.innerHTML = "";

        options.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.innerText = opt;
            btn.onclick = () => {
                if(idx === correct) {
                    alert("إجابة صحيحة! +20 نقطة");
                    points += 20;
                } else {
                    alert("خطأ! راجع المحاضرة.");
                }
                box.style.display = "none";
                document.getElementById('points').innerText = "الرصيد: " + points + " نقطة";
            };
            opts.appendChild(btn);
        });
    }
</script>

</body>
</html>
