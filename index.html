<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>كلمات متقاطعة | الدمويات</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">

<style>
:root {
  --bg:     #07101f;
  --bg2:    #0c1a2e;
  --card:   #0f2137;
  --blue:   #4fc3f7;
  --red:    #ef5350;
  --gold:   #ffd54f;
  --green:  #69f0ae;
  --text:   #eceff1;
  --muted:  #78909c;
  --border: rgba(79,195,247,.2);
}

*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  height: 100%; overflow: hidden;
  font-family: 'Cairo', sans-serif;
  background: var(--bg); color: var(--text);
  touch-action: manipulation;
}

.sc {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  transition: transform .38s cubic-bezier(.25,.46,.45,.94), opacity .3s ease;
  will-change: transform; overflow: hidden;
}
.sc.hr { transform: translateX(100%); opacity: 0; pointer-events: none; }
.sc.hl { transform: translateX(-100%); opacity: 0; pointer-events: none; }
.sc.on { transform: translateX(0); opacity: 1; }

.hdr {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 16px;
  background: rgba(7,16,31,.9);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0; z-index: 10;
}
.hdr-t { font-size: 18px; font-weight: 700; flex: 1; }
.bk {
  width: 38px; height: 38px;
  background: rgba(79,195,247,.1); border: 1px solid var(--border);
  border-radius: 12px; display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--blue); font-size: 20px;
  transition: background .15s; flex-shrink: 0;
}
.bk:active { background: rgba(79,195,247,.3); }

.pbar { height: 3px; background: rgba(79,195,247,.08); flex-shrink: 0; }
.pfill { height: 100%; background: var(--blue); transition: width .45s ease; }

/* شاشة الترحيب */
#sw {
  background: radial-gradient(ellipse at 20% 10%, #0d253f 0%, var(--bg) 70%);
  align-items: center; justify-content: center;
  padding: 28px; position: relative; overflow: hidden;
}
.bgc { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.bgc span {
  position: absolute; border-radius: 50%; opacity: .06;
  animation: drift 9s infinite ease-in-out alternate;
}
@keyframes drift { to { transform: translate(15px,-12px) scale(1.07); } }

.wi {
  z-index: 1; display: flex; flex-direction: column;
  align-items: center; gap: 22px; text-align: center;
  max-width: 340px; width: 100%;
}
.lg-wrap { position: relative; }
.lg {
  width: 94px; height: 94px;
  background: linear-gradient(135deg, #b71c1c, #ef5350);
  border-radius: 50%; font-size: 48px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 40px rgba(239,83,80,.45);
  animation: glow 3s ease-in-out infinite;
}
@keyframes glow { 50% { box-shadow: 0 0 70px rgba(239,83,80,.75), 0 0 18px rgba(239,83,80,.3); } }
.ring {
  position: absolute; inset: -10px; border-radius: 50%;
  border: 2px dashed rgba(239,83,80,.3);
  animation: spin 14s linear infinite;
}
.ring::before {
  content: '💊'; position: absolute;
  top: -10px; left: 50%; transform: translateX(-50%);
  font-size: 13px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.wt {
  font-size: 26px; font-weight: 900; line-height: 1.3;
  background: linear-gradient(120deg, #e3f2fd, var(--blue));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.ws { font-size: 13px; color: var(--muted); margin-top: -14px; }

.badges { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.bdg {
  padding: 6px 14px;
  background: rgba(79,195,247,.07); border: 1px solid var(--border);
  border-radius: 20px; font-size: 12px; color: var(--blue);
}
.btn-main {
  background: linear-gradient(135deg, var(--blue), #0288d1);
  border: none; border-radius: 18px; padding: 17px 32px;
  font-family: 'Cairo', sans-serif; font-size: 17px; font-weight: 700;
  color: #041526; cursor: pointer; width: 100%; max-width: 320px;
  box-shadow: 0 6px 24px rgba(79,195,247,.38);
  transition: transform .12s, box-shadow .12s;
  display: flex; align-items: center; justify-content: center; gap: 10px;
}
.btn-main.red { background: linear-gradient(135deg, #ef5350, #b71c1c); color: #fff; box-shadow: 0 6px 24px rgba(239,83,80,.38); }
.btn-main:active { transform: scale(.96); }

/* شاشة الألغاز */
#sc { background: var(--bg); }
.cl { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.cc {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 20px; padding: 18px 18px 18px 20px;
  cursor: pointer; display: flex; align-items: center; gap: 16px;
  position: relative; overflow: hidden;
  transition: transform .18s, background .18s;
}
.cc::before {
  content: ''; position: absolute; top: 0; right: 0;
  width: 4px; height: 100%;
  background: linear-gradient(180deg, var(--blue), var(--red));
}
.cc.done::before { background: linear-gradient(180deg, var(--green), #00695c); }
.cc:active { transform: scale(.97); background: rgba(79,195,247,.05); }
.c-ic { font-size: 44px; flex-shrink: 0; }
.c-inf { flex: 1; min-width: 0; }
.c-t { font-size: 19px; font-weight: 700; }
.c-d { font-size: 13px; color: var(--muted); margin-top: 3px; }
.c-s { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.cs { font-size: 11px; padding: 3px 10px; border-radius: 20px; }
.cs-b { background: rgba(79,195,247,.09); border: 1px solid rgba(79,195,247,.2); color: var(--blue); }
.cs-g { background: rgba(105,240,174,.09); border: 1px solid rgba(105,240,174,.2); color: var(--green); }
.cs-y { background: rgba(255,213,79,.09); border: 1px solid rgba(255,213,79,.2); color: var(--gold); }

/* شاشة الشبكة */
#sg { background: var(--bg); }
.g-hint { text-align: center; padding: 9px 16px; font-size: 13px; color: var(--muted); flex-shrink: 0; }
.gw { flex: 1; display: flex; align-items: center; justify-content: center; overflow: auto; padding: 12px; }
.cg {
  display: grid; gap: 2px; padding: 10px;
  background: rgba(255,255,255,.02);
  border: 1px solid var(--border); border-radius: 14px;
}
.cell {
  width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 7px; font-size: 14px; font-weight: 700;
  position: relative; transition: background .18s;
  text-transform: uppercase;
}
.cell.emp { background: transparent; }
.cell.ltr { background: rgba(12,26,46,.9); border: 1px solid rgba(79,195,247,.12); cursor: pointer; }
.cell.ltr:active { background: rgba(79,195,247,.28); }
.cell.slv { background: rgba(105,240,174,.13); border-color: rgba(105,240,174,.3); color: var(--green); }
.cnum { position: absolute; top: 1px; left: 2px; font-size: 8px; color: var(--blue); font-weight: 700; line-height: 1; }
.cell.slv .cnum { color: var(--green); }

/* شاشة السؤال */
#sq, #sbl { background: var(--bg); }
.qc { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.qmeta {
  display: flex; align-items: center; gap: 10px;
  font-size: 13px; color: var(--muted);
  padding: 8px 14px;
  background: rgba(79,195,247,.04);
  border: 1px solid var(--border); border-radius: 12px;
}
.qdir {
  padding: 4px 12px;
  background: rgba(79,195,247,.12); border-radius: 20px;
  color: var(--blue); font-size: 12px; font-weight: 600;
}
.qbox {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 20px; padding: 20px;
  display: flex; flex-direction: column; align-items: center;
  gap: 14px; min-height: 130px; justify-content: center;
}
.qimg { width: 100%; max-height: 180px; object-fit: contain; border-radius: 12px; display: none; }
.qtxt { font-size: 17px; font-weight: 600; text-align: center; line-height: 1.75; direction: rtl;}

.abwrap { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; direction: ltr; }
.ab {
  width: 40px; height: 48px;
  background: rgba(10,20,38,.9); border: 2px solid var(--border);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 700; transition: all .22s; text-transform: uppercase;
}
.ab.f  { background: rgba(79,195,247,.1);   border-color: var(--blue);  color: var(--blue);  }
.ab.ok { background: rgba(105,240,174,.12); border-color: var(--green); color: var(--green); animation: pop .4s ease; }
.ab.no { animation: shk .4s ease; border-color: var(--red); }
@keyframes pop { 0%{transform:scale(.65)} 70%{transform:scale(1.1)} 100%{transform:scale(1)} }
@keyframes shk { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

.pool {
  background: rgba(10,20,38,.6); border: 1px solid var(--border);
  border-radius: 20px; padding: 14px;
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; direction: ltr;
}
.pb {
  width: 45px; height: 45px;
  background: linear-gradient(135deg, var(--card), rgba(79,195,247,.07));
  border: 2px solid var(--border); border-radius: 12px;
  font-family: 'Cairo', sans-serif; font-size: 18px; font-weight: 700;
  color: var(--text); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: transform .14s, background .14s; text-transform: uppercase;
}
.pb:active { transform: scale(.87); background: rgba(79,195,247,.24); }
.pb.used   { opacity: .15; pointer-events: none; }
.del {
  width: 45px; height: 45px;
  background: rgba(239,83,80,.07); border: 2px solid rgba(239,83,80,.2);
  border-radius: 12px; font-size: 18px; color: var(--red); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .14s, transform .14s;
}
.del:active { background: rgba(239,83,80,.25); transform: scale(.9); }

/* أزرار الزمر الدموية */
.blood-grid {
  display: grid; gap: 10px; width: 100%; max-width: 250px; margin: 0 auto;
}
.blood-row1 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.blood-row2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; justify-content: center; }

/* اللوحات */
.ov {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 16px; z-index: 500; padding: 28px; text-align: center;
  opacity: 0; pointer-events: none; transition: opacity .3s;
}
.ov.vis { opacity: 1; pointer-events: all; }
#ovs { background: rgba(0,0,0,.93); backdrop-filter: blur(10px); }
#ovc { background: linear-gradient(155deg, #060f1c 0%, #061506 100%); }
.ov-em { font-size: 72px; animation: ob 1s ease-in-out infinite alternate; }
@keyframes ob { to { transform: translateY(-14px); } }
.ov-ti { font-size: 25px; font-weight: 900; color: var(--gold); }
.ov-wd { font-size: 22px; font-weight: 900; color: var(--green); letter-spacing: 3px; text-transform: uppercase; }
.ov-st { font-size: 34px; letter-spacing: 6px; }
.ov-sb { font-size: 14px; color: var(--muted); }
.btn-ov {
  border: none; border-radius: 16px; padding: 14px 38px;
  font-family: 'Cairo', sans-serif; font-size: 16px; font-weight: 700;
  cursor: pointer; transition: transform .12s;
}
.btn-ov:active { transform: scale(.95); }
.bgr { background: linear-gradient(135deg, var(--green), #00695c); color: #040f06; }
.bbl { background: linear-gradient(135deg, var(--blue), #0288d1); color: #04152a; }

.cf {
  position: fixed; pointer-events: none; z-index: 600;
  border-radius: 2px; animation: cf-fall 2s ease-out forwards;
}
@keyframes cf-fall { to { transform: translateY(110vh) rotate(720deg); opacity: 0; } }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: rgba(79,195,247,.18); border-radius: 4px; }
</style>
</head>
<body>

<div id="sw" class="sc on">
  <div class="bgc">
    <span style="width:270px;height:270px;top:-70px;right:-55px;background:#ef5350;animation-delay:0s"></span>
    <span style="width:210px;height:210px;bottom:-55px;left:-45px;background:#4fc3f7;animation-delay:3.5s;animation-duration:12s"></span>
    <span style="width:155px;height:155px;top:38%;right:30%;background:#ffc107;animation-delay:7s;animation-duration:10s"></span>
  </div>
  <div class="wi">
    <div class="lg-wrap">
      <div class="lg">🩸</div>
      <div class="ring"></div>
    </div>
    <div>
      <div class="wt">ملحق الدمويات</div>
      <div class="ws">كلية الصيدلة&nbsp;·&nbsp;السنة الثالثة&nbsp;·&nbsp;الفصل الثاني</div>
    </div>
    <div class="badges">
      <span class="bdg">🏥 Hematology</span>
      <span class="bdg">📖 اختبر معلوماتك</span>
    </div>
    <button class="btn-main" id="btn-start">
      🔤&ensp;بدء الألغاز والاختبارات
    </button>
  </div>
</div>

<div id="sc" class="sc hr">
  <div class="hdr">
    <div class="bk" id="bk1">&#8594;</div>
    <div class="hdr-t">اختر التحدي</div>
  </div>
  <div class="cl">
    <div id="catlist"></div>
    
    <button class="btn-main red" id="btn-blood" style="margin-top: 10px;">
      🩸 اختبار زمر الدم
    </button>
  </div>
</div>

<div id="sg" class="sc hr">
  <div class="hdr">
    <div class="bk" id="bk2">&#8594;</div>
    <div class="hdr-t" id="gtitle">اللغز</div>
  </div>
  <div class="pbar"><div class="pfill" id="gprog" style="width:0%"></div></div>
  <div class="g-hint">اضغط على أي مربع داخل الكلمة لفتح السؤال</div>
  <div class="gw"><div class="cg" id="cgrid"></div></div>
</div>

<div id="sq" class="sc hr">
  <div class="hdr">
    <div class="bk" id="bk3">&#8594;</div>
    <div class="hdr-t" id="qtitle">السؤال</div>
  </div>
  <div class="qc">
    <div class="qmeta">
      <span class="qdir" id="qdir">أفقي</span>
      <span>•</span>
      <span id="qnum">سؤال 1</span>
    </div>
    <div class="qbox">
      <img id="qimg" class="qimg" alt="صورة السؤال">
      <div id="qtext" class="qtxt"></div>
    </div>
    <div id="abwrap" class="abwrap"></div>
    <div id="pool" class="pool"></div>
  </div>
</div>

<div id="sbl" class="sc hr">
  <div class="hdr">
    <div class="bk" id="bk4">&#8594;</div>
    <div class="hdr-t">اختبار الزمر الدموية</div>
  </div>
  <div class="qc">
    <div class="qbox">
      <img id="bl-img" class="qimg" alt="صورة الزمرة">
      <div class="qtxt">ما هي الزمرة الدموية؟</div>
    </div>
    
    <div class="abwrap" style="margin: 10px 0;">
      <div class="ab" id="bl-abo"></div>
      <div class="ab" id="bl-rh"></div>
    </div>

    <div class="blood-grid">
      <div class="blood-row1">
        <button class="pb bl-btn" data-type="abo" data-val="A">A</button>
        <button class="pb bl-btn" data-type="abo" data-val="B">B</button>
        <button class="pb bl-btn" data-type="abo" data-val="AB">AB</button>
        <button class="pb bl-btn" data-type="abo" data-val="O">O</button>
      </div>
      <div class="blood-row2">
        <button class="pb bl-btn" data-type="rh" data-val="+">+</button>
        <button class="pb bl-btn" data-type="rh" data-val="-">-</button>
      </div>
      <div style="display:flex; justify-content:center; margin-top:5px;">
        <button class="del" id="bl-del">⌫</button>
      </div>
    </div>
  </div>
</div>

<div class="ov" id="ovs">
  <div class="ov-em">🎉</div>
  <div class="ov-ti">أحسنت!</div>
  <div class="ov-wd" id="ov-wd"></div>
  <button class="btn-ov bgr" id="btn-cont">التالي &larr;</button>
</div>

<div class="ov" id="ovc">
  <div class="ov-em">🏆</div>
  <div class="ov-ti">أنجزت اللغز!</div>
  <div class="ov-st">⭐⭐⭐</div>
  <div class="ov-sb" id="ovc-sub">حللت جميع الكلمات بنجاح 🎓</div>
  <button class="btn-ov bbl" id="btn-tocats">العودة</button>
</div>


<script>
/* ================================================================
   📚 بيانات اللعبة
================================================================ */
const GAME = {
  puzzles: [
    {
      id: 2,
      title: "لغز المصطلحات",
      icon: "🔬",
      description: "المصطلحات العلمية في الدمويات",
      cols: 25, rows: 35,
      words: [
        { id: 1,  answer: "NEUTROPHILS", question: "إلام تشير الأسهم الزرقاء؟", image: null, row: 17, col: 6, direction: "H" },
        { id: 2,  answer: "EOSINOPHIL",  question: "إلام يشير السهم الأحمر؟", image: null, row: 17, col: 7, direction: "V" },
        { id: 3,  answer: "LYMPHOCYTES", question: "إلام تشير الأسهم الصفراء؟", image: null, row: 26, col: 7, direction: "H" },
        { id: 4,  answer: "SMALLLYMPHOCYTE", question: "ما نوع الكرية البيضاء؟", image: null, row: 12, col: 16, direction: "V" },
        { id: 5,  answer: "MONOCYTE",    question: "إلام يشير السهم الأسود؟", image: null, row: 13, col: 16, direction: "H" },
        { id: 6,  answer: "TARGETCELL",  question: "إلام تشير الأسهم السوداء؟", image: null, row: 9, col: 23, direction: "V" },
        { id: 7,  answer: "ECHINOCYTES", question: "ماذا يوجد ضمن الحلقات السوداء؟", image: null, row: 9, col: 15, direction: "H" },
        { id: 8,  answer: "PLATELETS",   question: "ماذا يوجد ضمن الحلقة الصفراء؟", image: null, row: 5, col: 15, direction: "V" },
        { id: 9,  answer: "TEARDROPCELL",question: "ماذا يوجد ضمن الحلقات السوداء؟", image: null, row: 5, col: 8, direction: "H" },
        { id: 10, answer: "LARGELYMPHOCYTE", question: "ما نوع الكرية البيضاء؟", image: null, row: 1, col: 8, direction: "V" },
        { id: 11, answer: "BASOPHIL",    question: "ما نوع الكرية البيضاء؟", image: null, row: 1, col: 1, direction: "H" },
        // الكلمات المكررة أو المنفصلة
        { id: 12, answer: "EOSINOPHIL",  question: "ما نوع الكرية البيضاء؟", image: null, row: 29, col: 1, direction: "H" },
        { id: 13, answer: "MONOCYTE",    question: "ما نوع الكريات البيضاء؟", image: null, row: 31, col: 1, direction: "H" },
        // الكلمات العربية
        { id: 14, answer: "الشبكيات",    question: "ما الذي يظهر هنا بعد التلوين فوق الحيوي؟", image: null, row: 34, col: 1, direction: "H" },
        { id: 15, answer: "منجلية",      question: "ما نوع الكرية الموجودة داخل الحلقات السوداء؟", image: null, row: 30, col: 6, direction: "V" }
      ]
    }
  ]
};

// اختبارات زمر الدم
const BLOOD_TESTS = [
  { image: null, abo: 'A', rh: '+' },
  { image: null, abo: 'B', rh: '+' },
  { image: null, abo: 'AB', rh: '+' },
  { image: null, abo: 'O', rh: '+' }
];

/* ================================================================ */

let CUR  = 'sw';
let PZI  = 0;
let WI   = 0;
let INP  = [];
let POOL = [];
const SOL = {};

/* التنقل */
function $ (id) { return document.getElementById(id); }

function forward(id) {
  $(CUR).classList.replace('on','hl');
  const nx = $(id); nx.classList.remove('hr','hl'); nx.classList.add('on');
  CUR = id; onEnter(id);
}
function backward(id) {
  $(CUR).classList.replace('on','hr');
  const pv = $(id); pv.classList.remove('hl','hr'); pv.classList.add('on');
  CUR = id; onEnter(id);
}
function onEnter(id) {
  if (id === 'sc') buildCats();
  if (id === 'sg') buildGrid(GAME.puzzles[PZI]);
}

/* شاشة الألغاز */
function buildCats() {
  const el = $('catlist'); el.innerHTML = '';
  GAME.puzzles.forEach((pz, idx) => {
    const total = pz.words.length;
    const done  = pz.words.filter(w => SOL[`${pz.id}-${w.id}`]).length;
    const all   = done === total;
    const d = document.createElement('div');
    d.className = 'cc' + (all ? ' done' : '');
    d.innerHTML = `
      <div class="c-ic">${pz.icon}</div>
      <div class="c-inf">
        <div class="c-t">${pz.title}</div>
        <div class="c-d">${pz.description}</div>
        <div class="c-s">
          <span class="cs cs-b">📝 ${total} كلمة</span>
          <span class="cs cs-g">✅ ${done} محلولة</span>
          ${all ? '<span class="cs cs-y">🏆 مكتمل</span>' : ''}
        </div>
      </div>`;
    d.addEventListener('click', () => { PZI = idx; forward('sg'); });
    el.appendChild(d);
  });
}

/* بناء الشبكة */
function buildGrid(pz) {
  $('gtitle').textContent = pz.title;
  const el = $('cgrid');
  el.style.gridTemplateColumns = `repeat(${pz.cols},34px)`;
  el.style.gridTemplateRows    = `repeat(${pz.rows},34px)`;
  el.innerHTML = '';

  const G = Array.from({length: pz.rows}, () =>
    Array.from({length: pz.cols}, () => ({ l: null, wids: [], num: null }))
  );

  pz.words.forEach((w, wi) => {
    const ans = [...w.answer];
    ans.forEach((ltr, i) => {
      const r = w.direction === 'H' ? w.row     : w.row + i;
      const c = w.direction === 'H' ? w.col + i : w.col;
      if (r >= 0 && r < pz.rows && c >= 0 && c < pz.cols) {
        G[r][c].l = ltr;
        G[r][c].wids.push(wi);
        if (i === 0) { G[r][c].num = w.id; }
      }
    });
  });

  for (let r = 0; r < pz.rows; r++) {
    for (let c = 0; c < pz.cols; c++) {
      const cell = G[r][c];
      const div  = document.createElement('div');
      if (!cell.l) {
        div.className = 'cell emp';
      } else {
        // التحقق إن كانت كل الكلمات المتقاطعة هنا محلولة
        const allSlv = cell.wids.every(wi => SOL[`${pz.id}-${pz.words[wi].id}`]);
        div.className = 'cell ltr' + (allSlv ? ' slv' : '');
        if (allSlv) div.textContent = cell.l;
        
        // ميزة سلاسة الدخول: أي مربع في الكلمة يفتح السؤال الخاص بها
        div.dataset.wis = JSON.stringify(cell.wids);
        div.addEventListener('click', function() {
            const wids = JSON.parse(this.dataset.wis);
            // إذا كان المربع يتقاطع فيه كلمتان، ابحث عن الغير محلولة أولاً
            let targetWi = wids[0];
            if (wids.length > 1) {
                const unslv = wids.find(idx => !SOL[`${pz.id}-${pz.words[idx].id}`]);
                if (unslv !== undefined) targetWi = unslv;
            }
            openQ(targetWi);
        });

        if (cell.num !== null) {
          const s = document.createElement('span');
          s.className = 'cnum'; s.textContent = cell.num;
          div.appendChild(s);
        }
      }
      el.appendChild(div);
    }
  }

  const total = pz.words.length;
  const done  = pz.words.filter(w => SOL[`${pz.id}-${w.id}`]).length;
  $('gprog').style.width = (done / total * 100) + '%';
  
  // تمرير الشاشة للوسط لضمان ظهور الشبكة
  setTimeout(() => {
    const gw = document.querySelector('.gw');
    gw.scrollLeft = (gw.scrollWidth - gw.clientWidth) / 2;
    gw.scrollTop = (gw.scrollHeight - gw.clientHeight) / 2;
  }, 100);
}

/* فتح السؤال */
function openQ(wi) {
  WI = wi; INP = [];
  const pz = GAME.puzzles[PZI], w = pz.words[wi];

  $('qdir').textContent   = w.direction === 'H' ? '← أفقي →' : '↕ عمودي';
  $('qnum').textContent   = `سؤال ${w.id}`;
  $('qtitle').textContent = `سؤال ${w.id}`;

  const img = $('qimg');
  if (w.image) {
    img.src = w.image; img.style.display = 'block';
    img.onerror = () => { img.style.display = 'none'; };
  } else {
    img.style.display = 'none';
  }

  $('qtext').textContent = w.question;
  buildBoxes(w.answer.length);
  buildPool(w.answer);
  forward('sq');
}

/* خانات الإجابة */
function buildBoxes(n) {
  const el = $('abwrap'); el.innerHTML = '';
  for (let i = 0; i < n; i++) {
    const d = document.createElement('div');
    d.className = 'ab'; d.id = `ab${i}`;
    el.appendChild(d);
  }
}

/* مجموعة الحروف (تدعم إنجليزي وعربي) */
function buildPool(answer) {
  const isEn = /[a-zA-Z]/.test(answer);
  const ALPHABET = isEn 
    ? 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('') 
    : 'ابتثجحخدذرزسشصضطظعغفقكلمنهويأإآةى'.split('');
    
  const ans    = [...answer.toUpperCase()];
  const usedSet = new Set(ans);
  const avail  = shuffle(ALPHABET.filter(l => !usedSet.has(l)));
  const extra  = Math.min(8, Math.max(4, ans.length));
  POOL = shuffle([...ans, ...avail.slice(0, extra)]);

  const el = $('pool'); el.innerHTML = '';
  POOL.forEach((l, i) => {
    const b = document.createElement('button');
    b.className = 'pb'; b.id = `pb${i}`; b.textContent = l;
    b.addEventListener('click', () => pick(l, i));
    el.appendChild(b);
  });

  const del = document.createElement('button');
  del.className = 'del'; del.textContent = '⌫';
  del.addEventListener('click', rmLast);
  el.appendChild(del);
}

/* اختيار حرف */
function pick(l, pi) {
  const w = GAME.puzzles[PZI].words[WI];
  if (INP.length >= w.answer.length) return;
  const pos = INP.length; INP.push({ l, pi });
  $(`pb${pi}`).classList.add('used');
  const b = $(`ab${pos}`); b.textContent = l; b.classList.add('f');
  if (INP.length === w.answer.length) checkAnswer();
}

/* حذف آخر حرف */
function rmLast() {
  if (!INP.length) return;
  const last = INP.pop(), pos = INP.length;
  $(`pb${last.pi}`).classList.remove('used');
  const b = $(`ab${pos}`); b.textContent = ''; b.className = 'ab';
}

/* التحقق من الإجابة */
function checkAnswer() {
  const pz    = GAME.puzzles[PZI], w = pz.words[WI];
  const typed = INP.map(x => x.l).join('');
  const ok    = typed.toUpperCase() === w.answer.toUpperCase();

  [...w.answer].forEach((_, i) => $(`ab${i}`).classList.add(ok ? 'ok' : 'no'));

  if (ok) {
    SOL[`${pz.id}-${w.id}`] = true;
    launchConfetti();
    setTimeout(() => {
      $('ov-wd').textContent = w.answer;
      $('ovs').classList.add('vis');
    }, 500);
  } else {
    setTimeout(() => {
      INP = [];
      [...w.answer].forEach((_, i) => {
        const b = $(`ab${i}`); b.textContent = ''; b.className = 'ab';
      });
      POOL.forEach((_, i) => $(`pb${i}`)?.classList.remove('used'));
    }, 950);
  }
}

/* ================================================================
   🩸 منطق اختبار زمر الدم
================================================================ */
let bl_idx = 0;
let bl_ans = { abo: '', rh: '' };
let inBloodMode = false;

$('btn-blood').addEventListener('click', () => {
  bl_idx = 0;
  inBloodMode = true;
  loadBloodTest();
  forward('sbl');
});

function loadBloodTest() {
  const t = BLOOD_TESTS[bl_idx];
  const img = $('bl-img');
  if (t.image) {
    img.src = t.image; img.style.display = 'block';
  } else {
    img.style.display = 'none';
  }
  bl_ans = { abo: '', rh: '' };
  updateBlUI();
}

function updateBlUI() {
  $('bl-abo').textContent = bl_ans.abo;
  $('bl-rh').textContent = bl_ans.rh;
  
  if (bl_ans.abo && bl_ans.rh) {
    checkBlood();
  }
}

document.querySelectorAll('.bl-btn').forEach(b => {
  b.addEventListener('click', (e) => {
    const type = e.target.dataset.type;
    const val = e.target.dataset.val;
    bl_ans[type] = val;
    updateBlUI();
  });
});

$('bl-del').addEventListener('click', () => {
  if (bl_ans.rh) bl_ans.rh = '';
  else if (bl_ans.abo) bl_ans.abo = '';
  updateBlUI();
});

function checkBlood() {
  const t = BLOOD_TESTS[bl_idx];
  const isOk = (bl_ans.abo === t.abo && bl_ans.rh === t.rh);
  
  if (isOk) {
    $('bl-abo').classList.add('ok'); $('bl-rh').classList.add('ok');
    launchConfetti();
    setTimeout(() => {
      $('bl-abo').classList.remove('ok'); $('bl-rh').classList.remove('ok');
      bl_idx++;
      if (bl_idx >= BLOOD_TESTS.length) {
        $('ov-wd').textContent = "زمر الدم";
        $('ovc-sub').textContent = "نجحت في تشخيص جميع الزمر 🩸";
        $('ovc').classList.add('vis');
      } else {
        loadBloodTest();
      }
    }, 1000);
  } else {
    $('bl-abo').classList.add('no'); $('bl-rh').classList.add('no');
    setTimeout(() => {
      $('bl-abo').classList.remove('no'); $('bl-rh').classList.remove('no');
      bl_ans = { abo: '', rh: '' };
      updateBlUI();
    }, 600);
  }
}


/* ================================================================
   أحداث اللوحات
================================================================ */
$('btn-cont').addEventListener('click', () => {
  $('ovs').classList.remove('vis');
  const pz    = GAME.puzzles[PZI];
  const allOk = pz.words.every(w => SOL[`${pz.id}-${w.id}`]);
  if (allOk) {
    $('ovc-sub').textContent = "حللت جميع الكلمات بنجاح 🎓";
    setTimeout(() => $('ovc').classList.add('vis'), 200);
  } else {
    backward('sg');
  }
});

$('btn-tocats').addEventListener('click', () => {
  $('ovc').classList.remove('vis');
  $(CUR).classList.replace('on', 'hr');
  const el = $('sc'); el.classList.remove('hl', 'hr'); el.classList.add('on');
  CUR = 'sc'; 
  inBloodMode = false;
  buildCats();
});

/* كونفيتي */
function launchConfetti() {
  const C = ['#ffd54f','#4fc3f7','#69f0ae','#ef5350','#ce93d8','#ff8a65','#fff176'];
  for (let i = 0; i < 55; i++) {
    const d = document.createElement('div');
    d.className = 'cf';
    const s = 5 + Math.random() * 7;
    d.style.cssText = `
      left: ${Math.random() * 100}vw; top: 0;
      background: ${C[i % C.length]};
      width: ${s}px; height: ${s}px;
      animation-delay: ${Math.random() * .8}s;
      animation-duration: ${1.4 + Math.random() * .9}s;
    `;
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 3500);
  }
}

/* مساعدات */
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* الأزرار الأساسية */
$('btn-start').addEventListener('click', () => forward('sc'));
$('bk1').addEventListener('click', () => backward('sw'));
$('bk2').addEventListener('click', () => backward('sc'));
$('bk3').addEventListener('click', () => backward('sg'));

    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
  }
  document.querySelectorAll('.sc').forEach(s => {
    if (s.id !== 'sw') { s.classList.add('hr'); s.classList.remove('on'); }
  });
})();
</script>
