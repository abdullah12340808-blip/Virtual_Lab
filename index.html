<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المخبر الافتراضي - جامعة حماة</title>
  <style>
    :root {
      --bg: #08111f; --panel: #101c33; --panel-2: #162544; --text: #eef4ff;
      --muted: #9fb2d1; --accent: #38bdf8; --accent-2: #22c55e; --danger: #ef4444;
      --warn: #f59e0b; --border: rgba(255,255,255,.08); --shadow: 0 12px 30px rgba(0,0,0,.25);
    }* { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: radial-gradient(circle at top, #112040 0%, var(--bg) 60%); color: var(--text); min-height: 100vh; }
    .app { max-width: 1200px; margin: 0 auto; padding: 16px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: rgba(16, 28, 51, .86); border: 1px solid var(--border); border-radius: 20px; margin-bottom: 16px; backdrop-filter: blur(8px); }
    .brand h1 { margin: 0; font-size: 20px; color: #7dd3fc; }
    .chip { padding: 6px 12px; border-radius: 999px; background: rgba(56, 189, 248, .12); color: #bfe9ff; font-size: 13px; border: 1px solid rgba(56, 189, 248, .22); }
    .screen { display: none; } .screen.active { display: block; }
    .panel { background: rgba(16, 28, 51, .92); border: 1px solid var(--border); border-radius: 24px; padding: 20px; }
    .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
    .card { background: linear-gradient(180deg, rgba(22,37,68,.95), rgba(12,21,39,.95)); border: 1px solid var(--border); border-radius: 20px; padding: 18px; cursor: pointer; transition: 0.2s; }
    .card:hover { transform: translateY(-3px); border-color: var(--accent); }
    .btn { border: none; border-radius: 12px; padding: 10px 16px; cursor: pointer; background: var(--accent); color: #08111f; font-weight: bold; }
    .btn.secondary { background: rgba(255,255,255,.1); color: white; border: 1px solid var(--border); }
    /* Lab Visuals */
    .lab-layout { display: grid; grid-template-columns: 300px 1fr; gap: 20px; }
    .tube-wrap { width: 100px; height: 250px; border: 4px solid white; border-radius: 0 0 50px 50px; position: relative; margin: 20px auto; overflow: hidden; }
    .liquid { position: absolute; bottom: 0; width: 100%; height: 0%; transition: 0.5s; background: rgba(255,255,255,0.2); }
    .precipitate { position: absolute; bottom: 0; width: 100%; height: 20%; background: white; opacity: 0; transition: 0.5s; }
    .step-list { display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; }
    .step-btn { flex: 0 0 180px; padding: 12px; background: var(--panel-2); border: 1px solid var(--border); color: white; border-radius: 12px; cursor: pointer; }
    .correct { border-color: var(--accent-2) !important; } .wrong { border-color: var(--danger) !important; }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand"><h1>المخبر الافتراضي</h1></div>
      <div class="chip" id="navPath">الرئيسية</div>
    </div>

    <section id="selectionScreen" class="screen active">
      <div class="panel">
        <h2 id="selectionTitle">اختر السنة الدراسية</h2>
        <div id="selectionGrid" class="grid"></div>
        <div class="actions" style="margin-top:20px; display:none;" id="backBtnArea">
            <button class="btn secondary" onclick="goBack()">العودة</button>
        </div>
      </div>
    </section>

    <section id="labScreen" class="screen">
      <div class="panel">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h2 id="labTitle">التجربة</h2>
            <button class="btn secondary" onclick="exitLab()">إنهاء</button>
        </div>
        <div class="lab-layout">
          <div class="card" style="text-align:center;">
            <div class="tube-wrap">
                <div id="liquid" class="liquid"></div>
                <div id="precip" class="precipitate"></div>
            </div>
            <p id="visualStatus">الأنبوب فارغ</p>
          </div>
          <div>
            <div class="card">
                <h3>المطلوب:</h3>
                <p id="labPrompt"></p>
            </div>
            <div style="margin-top:20px;">
                <h3>الخطوات:</h3>
                <div id="stepList" class="step-list"></div>
            </div>
            <div id="statusMsg" style="margin-top:20px; font-weight:bold;"></div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script>
    const academicData = {
      "years": [
        { id: "y2", name: "السنة الثانية", terms: {
            "t1": ["الكيمياء الفيزيائية", "الحاسوب", "الصيدلانيات 1", "الكيمياء العضوية 1"],
            "t2": ["الكيمياء العضوية 2", "الكيمياء الحيوية 1", "العقاقير 1", "التحليلية 1", "الصيدلانيات 2"]
        }},
        { id: "y3", name: "السنة الثالثة", terms: {
            "t1": ["التحليلية 2", "الأحياء 1", "العقاقير 2", "فارماكولوجي 1", "التكنولوجيا الصيدلية"],
            "t2": ["التحليل الآلي", "كيمياء العقاقير", "الدمويات", "فارماكولوجي 2", "الكيمياء صيدلية 1", "الأحياء 2"]
        }}
      ]
    };

    // بيانات التجارب المستخرجة من ملف الكيمياء الصيدلية 1 (الكالسيوم والمغنيزيوم)
    const labs = {
      "الكيمياء صيدلية 1": [
        {
          title: "الكشف عن الكالسيوم (حماضات النشادر)",
          prompt: "لديك محلول يحتوي شوارد الكالسيوم، قم بالكشف عنه باستخدام حماضات النشادر.",
          steps: [
            { id: 1, text: "إضافة 2 مل من محلول الكالسيوم", correct: true, effect: { h: "20%", c: "rgba(255,255,255,0.2)" }},
            { id: 2, text: "إضافة 1 مل من حماضات النشادر", correct: true, effect: { h: "40%", c: "#fff", precip: true }},
            { id: 3, text: "التحقق من ذوبان الراسب بحمض كلور الماء", correct: true, effect: { h: "50%", c: "rgba(255,255,255,0.3)", precip: false }}
          ]
        },
        {
          title: "الكشف عن المغنيزيوم (فوسفات ثنائية الصوديوم)",
          prompt: "قم بالكشف عن شوارد المغنيزيوم لتشكيل راسب أبيض بلوري.",
          steps: [
            { id: 1, text: "إضافة 1 مل من شوارد المغنيزيوم", correct: true, effect: { h: "20%" }},
            { id: 2, text: "إضافة 1 مل فوسفات ثنائية الصوديوم 10%", correct: true, effect: { h: "35%" }},
            { id: 3, text: "إضافة هيدروكسيد الأمونيوم", correct: true, effect: { h: "50%", c: "#fff", precip: true }}
          ]
        }
      ]
    };

    let state = { view: 'years', year: null, term: null, subject: null };
    let currentLab = null;
    let currentStep = 0;

    function render() {
      const grid = document.getElementById('selectionGrid');
      const title = document.getElementById('selectionTitle');
      const backBtn = document.getElementById('backBtnArea');
      grid.innerHTML = "";
      
      if (state.view === 'years') {
        title.innerText = "اختر السنة الدراسية";
        backBtn.style.display = "none";
        academicData.years.forEach(y => grid.appendChild(createCard(y.name, () => { state.year = y; state.view = 'terms'; render(); })));
      } 
      else if (state.view === 'terms') {
        title.innerText = state.year.name;
        backBtn.style.display = "block";
        [1, 2].forEach(t => grid.appendChild(createCard(`الفصل ${t === 1 ? 'الأول' : 'الثاني'}`, () => { state.term = t; state.view = 'subjects'; render(); })));
      }
      else if (state.view === 'subjects') {
        title.innerText = `مواد الفصل ${state.term === 1 ? 'الأول' : 'الثاني'}`;
        const subjects = state.year.terms[`t${state.term}`] || [];
        subjects.forEach(s => grid.appendChild(createCard(s, () => { state.subject = s; state.view = 'sessions'; render(); })));
      }
      else if (state.view === 'sessions') {
        title.innerText = `جلسات ${state.subject}`;
        const sessions = labs[state.subject] || [];
        if (sessions.length === 0) grid.innerHTML = "<p>سيتم إضافة التجارب قريباً...</p>";
        sessions.forEach(lab => grid.appendChild(createCard(lab.title, () => startLab(lab))));
      }
      updatePath();
    }

    function createCard(text, onClick) {
      const d = document.createElement('div');
      d.className = 'card';
      d.innerHTML = `<h3>${text}</h3>`;
      d.onclick = onClick;
      return d;
    }

    function goBack() {
      if (state.view === 'sessions') state.view = 'subjects';
      else if (state.view === 'subjects') state.view = 'terms';
      else if (state.view === 'terms') state.view = 'years';
      render();
    }

    function updatePath() {
        let path = "الرئيسية";
        if (state.year) path += ` > ${state.year.name}`;
        if (state.subject) path += ` > ${state.subject}`;
        document.getElementById('navPath').innerText = path;
    }

    // Lab Logic
    function startLab(lab) {
      currentLab = lab;
      currentStep = 0;
      document.getElementById('selectionScreen').classList.remove('active');
      document.getElementById('labScreen').classList.add('active');
      document.getElementById('labTitle').innerText = lab.title;
      document.getElementById('labPrompt').innerText = lab.prompt;
      resetLabVisuals();
      renderSteps();
    }

    function renderSteps() {
      const area = document.getElementById('stepList');
      area.innerHTML = "";
      // عرض الخطوات بترتيب عشوائي للتمويه
      const shuffled = [...currentLab.steps].sort(() => Math.random() - 0.5);
      shuffled.forEach(step => {
        const btn = document.createElement('button');
        btn.className = 'step-btn';
        btn.innerText = step.text;
        btn.onclick = () => handleStep(step, btn);
        area.appendChild(btn);
      });
    }

    function handleStep(step, btn) {
      const correctStep = currentLab.steps[currentStep];
      if (step.id === correctStep.id) {
        btn.classList.add('correct');
        btn.disabled = true;
        applyEffect(step.effect);
        currentStep++;
        if (currentStep === currentLab.steps.length) {
          document.getElementById('statusMsg').innerHTML = "<span style='color:var(--accent-2)'>أحسنت! تمت التجربة بنجاح.</span>";
        }
      } else {
        btn.classList.add('wrong');
        document.getElementById('statusMsg').innerHTML = "<span style='color:var(--danger)'>خطأ في التسلسل! أعد المحاولة.</span>";
        setTimeout(exitLab, 1500);
      }
    }

    function applyEffect(eff) {
      if (eff.h) document.getElementById('liquid').style.height = eff.h;
      if (eff.c) document.getElementById('liquid').style.background = eff.c;
      if (eff.precip) document.getElementById('precip').style.opacity = "1";
      else document.getElementById('precip').style.opacity = "0";
    }

    function resetLabVisuals() {
      document.getElementById('liquid').style.height = "0%";
      document.getElementById('precip').style.opacity = "0";
      document.getElementById('statusMsg').innerText = "";
    }

    function exitLab() {
      document.getElementById('labScreen').classList.remove('active');
      document.getElementById('selectionScreen').classList.add('active');
    }

    render();
  </script>
</body>
</html>
