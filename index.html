<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>المخبر الافتراضي - جامعة حماه</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #f0f2f5; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .app-container { background: white; width: 100%; max-width: 400px; padding: 20px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); text-align: center; }
        .screen { display: none; }
        .screen.active { display: block; }
        
        /* تصميم الأنبوب */
        .tube-section { height: 220px; background: #f8f9fa; border-radius: 10px; position: relative; margin: 15px 0; display: flex; justify-content: center; align-items: flex-end; border: 1px solid #ddd; }
        .tube { width: 50px; height: 160px; border: 3px solid #777; border-bottom-left-radius: 25px; border-bottom-right-radius: 25px; position: relative; overflow: hidden; background: rgba(255,255,255,0.7); z-index: 2; }
        .liquid { position: absolute; bottom: 0; width: 100%; height: 50%; background: rgba(173, 216, 230, 0.3); transition: 0.5s; }
        .precipitate { position: absolute; bottom: 0; width: 100%; height: 0%; transition: 0.7s; filter: blur(1px); }
        .fire { position: absolute; bottom: -5px; width: 40px; height: 60px; display: none; filter: blur(5px); z-index: 1; }

        /* الأزرار */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        button { padding: 12px; border: none; border-radius: 8px; background: #2c3e50; color: white; cursor: pointer; font-size: 14px; font-weight: bold; -webkit-tap-highlight-color: transparent; }
        button:active { transform: scale(0.95); background: #34495e; }
        .btn-main { width: 100%; margin-bottom: 10px; height: 50px; }
        .btn-ca { background: #2980b9; }
        .btn-mg { background: #27ae60; }
        .btn-back { background: #e74c3c; grid-column: span 2; margin-top: 10px; }

        .status-msg { min-height: 50px; color: #d35400; font-weight: bold; padding: 10px; font-size: 14px; line-height: 1.5; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="home-screen" class="screen active">
        <h2>المخبر الافتراضي</h2>
        <p>السنة الثالثة - الكيمياء الصيدلية 1</p>
        <button id="start-ca" class="btn-main btn-ca">كشف شوارد الكالسيوم</button>
        <button id="start-mg" class="btn-main btn-mg">كشف شوارد المغنيزيوم</button>
    </div>

    <div id="lab-screen" class="screen">
        <h3 id="lab-title">تفاعل الكشف</h3>
        <div class="tube-section">
            <div id="visual-fire" class="fire"></div>
            <div class="tube">
                <div class="liquid"></div>
                <div id="visual-prec" class="precipitate"></div>
            </div>
        </div>
        <div id="msg" class="status-msg">جاهز لبدء التجربة...</div>
        
        <div id="ca-tools" class="grid" style="display:none;">
            <button id="ca-ox">حماضات النشادر</button>
            <button id="ca-hcl">حمض HCl</button>
            <button id="ca-flame">اختبار اللهب</button>
            <button id="ca-sulf">كبريتات الصوديوم</button>
        </div>

        <div id="mg-tools" class="grid" style="display:none;">
            <button id="mg-phos">فوسفات الصوديوم</button>
            <button id="mg-naoh">هيدروكسيد الصوديوم</button>
            <button id="mg-carb">كربونات الصوديوم</button>
            <button id="mg-ace">حمض الخل</button>
        </div>

        <button id="go-back" class="btn-back">رجوع للقائمة</button>
    </div>
</div>

<script>
window.onload = function() {
    // العناصر
    const home = document.getElementById('home-screen');
    const lab = document.getElementById('lab-screen');
    const prec = document.getElementById('visual-prec');
    const fire = document.getElementById('visual-fire');
    const msg = document.getElementById('msg');
    
    // شاشات الأدوات
    const caTools = document.getElementById('ca-tools');
    const mgTools = document.getElementById('mg-tools');

    // وظائف الانتقال
    document.getElementById('start-ca').addEventListener('click', function() {
        showLab("الكالسيوم", "ca");
    });

    document.getElementById('start-mg').addEventListener('click', function() {
        showLab("المغنيزيوم", "mg");
    });

    document.getElementById('go-back').addEventListener('click', function() {
        home.classList.add('active');
        lab.classList.remove('active');
        resetAll();
    });

    function showLab(name, type) {
        home.classList.remove('active');
        lab.classList.add('active');
        document.getElementById('lab-title').innerText = "كشف شاردة " + name;
        resetAll();
        if(type === 'ca') {
            caTools.style.display = 'grid';
            mgTools.style.display = 'none';
        } else {
            mgTools.style.display = 'grid';
            caTools.style.display = 'none';
        }
    }

    // تفاعلات الكالسيوم
    document.getElementById('ca-ox').onclick = function() {
        prec.style.height = "45%"; prec.style.background = "white";
        [span_0](start_span)msg.innerText = "تشكل راسب أبيض من حماضات الكالسيوم[span_0](end_span)";
    };
    document.getElementById('ca-hcl').onclick = function() {
        prec.style.height = "0%";
        [span_1](start_span)msg.innerText = "انحلال الراسب في حمض كلور الماء[span_1](end_span)";
    };
    document.getElementById('ca-flame').onclick = function() {
        fire.style.display = "block"; fire.style.background = "orange";
        [span_2](start_span)msg.innerText = "يتلون اللهب باللون البرتقالي[span_2](end_span)";
    };
    document.getElementById('ca-sulf').onclick = function() {
        prec.style.height = "30%"; prec.style.background = "#f8f8f8";
        [span_3](start_span)msg.innerText = "تشكل راسب أبيض من كبريتات الكالسيوم[span_3](end_span)";
    };

    // تفاعلات المغنيزيوم
    document.getElementById('mg-phos').onclick = function() {
        prec.style.height = "50%"; prec.style.background = "white";
        [span_4](start_span)msg.innerText = "ظهور راسب أبيض بلوري (فوسفات الأمونيوم والمغنيزيوم)[span_4](end_span)";
    };
    document.getElementById('mg-naoh').onclick = function() {
        prec.style.height = "40%"; prec.style.background = "white";
        [span_5](start_span)msg.innerText = "راسب أبيض من هيدروكسيد المغنيزيوم لا ينحل بالزيادة[span_5](end_span)";
    };
    document.getElementById('mg-carb').onclick = function() {
        prec.style.height = "35%"; prec.style.background = "white";
        [span_6](start_span)msg.innerText = "راسب أبيض من كربونات المغنيزيوم[span_6](end_span)";
    };
    document.getElementById('mg-ace').onclick = function() {
        prec.style.height = "0%";
        [span_7](start_span)msg.innerText = "ينحل راسب الفوسفات في حمض الخل[span_7](end_span)";
    };

    function resetAll() {
        prec.style.height = "0%";
        fire.style.display = "none";
        msg.innerText = "جاهز للإضافة...";
    }
};
</script>

</body>
</html>
