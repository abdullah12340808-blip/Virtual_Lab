<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المخبر الافتراضي - جامعة حماه</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; width: 90%; max-width: 450px; padding: 20px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); text-align: center; }
        .tube-area { height: 250px; display: flex; justify-content: center; align-items: flex-end; position: relative; margin: 20px 0; background: #eef2f3; border-radius: 10px; }
        .tube { width: 60px; height: 180px; border: 3px solid #999; border-bottom-left-radius: 30px; border-bottom-right-radius: 30px; position: relative; overflow: hidden; background: rgba(255,255,255,0.5); z-index: 2; }
        .liquid { position: absolute; bottom: 0; width: 100%; height: 50%; background: rgba(173, 216, 230, 0.4); transition: 0.5s; }
        .precipitate { position: absolute; bottom: 0; width: 100%; height: 0%; background: white; transition: 0.8s; filter: blur(1px); }
        .flame { position: absolute; bottom: -10px; width: 40px; height: 60px; border-radius: 50% 50% 20% 20%; display: none; filter: blur(5px); z-index: 1; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { padding: 12px; border: none; border-radius: 8px; background: #2c3e50; color: white; cursor: pointer; font-weight: bold; font-size: 14px; }
        button:active { background: #1a252f; transform: scale(0.98); }
        .msg { margin: 15px 0; min-height: 40px; color: #d35400; font-weight: bold; }
        .hidden { display: none; }
        .nav-btn { background: #e74c3c; grid-column: span 2; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>المخبر الافتراضي</h2>
    
    <div id="start-screen">
        <p>الجلسة الأولى: الكيمياء الصيدلية 1</p>
        <button id="choose-ca" style="width:100%; margin-bottom:10px; background:#2980b9;">بدء تجربة الكالسيوم</button>
        <button id="choose-mg" style="width:100%; background:#27ae60;">بدء تجربة المغنيزيوم</button>
    </div>

    <div id="lab-screen" class="hidden">
        <p id="ion-title"></p>
        <div class="tube-area">
            <div id="flame-img" class="flame"></div>
            <div class="tube">
                <div class="liquid"></div>
                <div id="precipitate-layer" class="precipitate"></div>
            </div>
        </div>
        <div id="info-msg" class="msg">جاهز للإضافة...</div>
        <div class="btn-grid" id="action-buttons"></div>
        <button class="nav-btn" id="back-home">تغيير الشاردة</button>
    </div>
</div>

<script>
    const startScreen = document.getElementById('start-screen');
    const labScreen = document.getElementById('lab-screen');
    const ionTitle = document.getElementById('ion-title');
    const infoMsg = document.getElementById('info-msg');
    const precipitate = document.getElementById('precipitate-layer');
    const flame = document.getElementById('flame-img');
    const actionButtons = document.getElementById('action-buttons');

    let currentIon = "";

    // بدء تجربة الكالسيوم
    document.getElementById('choose-ca').addEventListener('click', () => {
        setupLab("الكالسيوم", "Ca");
    });

    // بدء تجربة المغنيزيوم
    document.getElementById('choose-mg').addEventListener('click', () => {
        setupLab("المغنيزيوم", "Mg");
    });

    function setupLab(name, code) {
        currentIon = code;
        startScreen.classList.add('hidden');
        labScreen.classList.remove('hidden');
        ionTitle.innerText = "كشف شاردة " + name;
        resetTube();
        renderControls();
    }

    function renderControls() {
        actionButtons.innerHTML = "";
        if (currentIon === "Ca") {
            addButton("حماضات النشادر", () => {
                precipitate.style.height = "40%";
                precipitate.style.background = "white";
                infoMsg.innerText = "تشكل راسب أبيض من حماضات الكالسيوم";
            });
            addButton("حمض HCl", () => {
                precipitate.style.height = "0%";
                infoMsg.innerText = "ينحل الراسب في حمض كلور الماء";
            });
            addButton("اختبار اللهب", () => {
                flame.style.display = "block";
                flame.style.background = "orange";
                infoMsg.innerText = "تلوين اللهب باللون البرتقالي";
            });
            addButton("كبريتات الصوديوم", () => {
                precipitate.style.height = "30%";
                precipitate.style.background = "#f9f9f9";
                infoMsg.innerText = "تشكل راسب أبيض من كبريتات الكالسيوم";
            });
        } else {
            addButton("فوسفات الصوديوم", () => {
                precipitate.style.height = "45%";
                precipitate.style.background = "white";
                infoMsg.innerText = "راسب أبيض بلوري من فوسفات الأمونيوم والمغنيزيوم";
            });
            addButton("هيدروكسيد الصوديوم", () => {
                precipitate.style.height = "35%";
                infoMsg.innerText = "راسب أبيض من هيدروكسيد المغنيزيوم";
            });
            addButton("كربونات الصوديوم", () => {
                precipitate.style.height = "30%";
                infoMsg.innerText = "راسب أبيض من كربونات المغنيزيوم";
            });
            addButton("حمض الخل", () => {
                precipitate.style.height = "0%";
                infoMsg.innerText = "يذوب راسب المغنيزيوم في حمض الخل";
            });
        }
    }

    function addButton(text, action) {
        const btn = document.createElement('button');
        btn.innerText = text;
        btn.onclick = action;
        actionButtons.appendChild(btn);
    }

    document.getElementById('back-home').addEventListener('click', () => {
        startScreen.classList.remove('hidden');
        labScreen.classList.add('hidden');
    });

    function resetTube() {
        precipitate.style.height = "0%";
        flame.style.display = "none";
        infoMsg.innerText = "جاهز للإضافة...";
    }
</script>

</body>
</html>
