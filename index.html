<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المخبر الافتراضي</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>اختبار الكيمياء الصيدلية</h1>
        <p>اختبر معرفتك بالمواد الكيميائية من خلال التفاعلات المختبرية التفاعلية.</p>
    </header>

    <div class="experiment">
        <div id="testTube" class="test-tube">
            <div class="liquid" id="liquid"></div>
        </div>
        <div class="buttons">
            <button onclick="addChemical('calcium')">إضافة شوارد الكالسيوم</button>
            <button onclick="addChemical('magnesium')">إضافة شوارد المغنيزيوم</button>
            <button onclick="addChemical('phosphate')">إضافة فوسفات ثنائية الصوديوم</button>
        </div>
    </div>

    <div id="result"></div>

    <script src="script.js"></script>
</body>
</html>
